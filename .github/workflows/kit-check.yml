# The kit's own check (kit/checks/kit_check.py --quick) on every push to main and every pull request that
# touches the kit or the maker: the look keys and the names, then every page that loads the kit drawn in Chrome
# with no window (draws, same, ms, cues; the arms are left for a whole check on the laptop). A page that needs a
# file not kept in git is left out, as it is anywhere. What failed is written as an error on the run's page.
name: kit check

on:
  push:
    branches: [main]
    paths: ["kit/**", "maker/**", "requirements.txt", ".github/workflows/kit-check.yml"]
  pull_request:
    paths: ["kit/**", "maker/**", "requirements.txt", ".github/workflows/kit-check.yml"]
  workflow_dispatch:

# A pull request's newer push replaces its check still running; every push to main is checked to the end, each
# on its own (with two sessions pushing minutes apart, cancelling on main left no check that finished).
concurrency:
  group: kit-check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kit-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chrome
      - name: kit_check.py --quick
        working-directory: kit
        shell: bash
        run: python checks/kit_check.py --quick | tee kit_check_ci.txt
      - name: what failed, as errors on the run's page
        if: failure()
        working-directory: kit
        shell: bash
        run: |
          grep "FAILED" kit_check_ci.txt | head -50 | while IFS= read -r line; do
            echo "::error title=kit_check::$line"
          done
