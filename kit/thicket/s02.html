<script>
// Scene 2 of "Through the flowers" on its own, to look at and render while it is made.
var DURATION = HEDGE_LONG;
var SCENES = [[0, HEDGE_LONG, s02Hedge]];
function draw(t) { film(t, SCENES); }
var rendering = false;
function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}
requestAnimationFrame(play);
</script>
