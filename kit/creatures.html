<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>creatures - the nine feelings on the creatures</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {hop: false, sun: "face"};   // the sun with its 1930s face, the one with feelings</script>
<script src="oldcartoon.js"></script>
<script src="naga.js"></script>
<script src="dragon.js"></script>
<script src="beasts.js"></script>
<script src="myth.js"></script>
<script src="northbirds.js"></script>
<script>
// The "creatures" sheet: the nine feelings a person takes by name (see
// feelings.html), on the creatures, each creature a part of twelve seconds,
// five feelings to a row. A creature's look takes feel: "happy" as a
// person's does; creatureFeel() turns it into eyes, brows and a mouth, and
// into how it carries its head, its ears and its tail. Twelve seconds, so
// that every sleepy one nods and yawns, and every laughing one laughs.
var DURATION = 228;

var BEAT = 0.5;

var NAMES = [["neutral", "เฉย ๆ"], ["happy", "ดีใจ"], ["laughing", "หัวเราะ"], ["sad", "เศร้า"], ["concerned", "กังวล"],
             ["angry", "โกรธ"], ["sleepy", "ง่วง"], ["satiated", "อิ่ม"], ["surprised", "ประหลาดใจ"]];

// Each part: its title, and how to draw the creature with a feeling, standing on (x, y) in a cell.
var PARTS = [
  ["a dog", function (x, y, feel, t) {
    pen.save(); pen.translate(x - 8, y); pen.scale(1.5, 1.5); dog(0, 0, t, {feel: feel}); pen.restore();
  }],
  ["a rooster", function (x, y, feel, t) {
    pen.save(); pen.translate(x + 40, y); pen.scale(2.1, 2.1); rooster(0, 0, t, {feel: feel}); pen.restore();
  }],
  // the big ones close up: each placed by where its own drawing puts its eye, so the eye is at (ex, ey) of the cell
  ["a naga, one head", function (x, y, feel, t, ex, ey) {
    naga(ex - 117 * 2.2, ey + 365 * 2.2, {size: 2.2, heads: 1, feel: feel});
  }],
  ["a dragon of the Himalayan paintings", function (x, y, feel, t, ex, ey) {
    dragon(ex - 30 * 1.22, ey + 34 * 1.22, {size: 1, face: 1, feel: feel});
  }],
  ["a Chinese dragon", function (x, y, feel, t, ex, ey) {
    dragon(ex - 38 * 1.22 * 0.9, ey + 40 * 1.22 * 0.9, {kind: "chinese", size: 0.9, face: 1, chase: false, feel: feel});
  }],
  ["the Mom, a guardian of temple stairs", function (x, y, feel, t, ex, ey) {
    mom(ex - 194 * 0.9, ey + 242 * 0.9, {size: 1, feel: feel});
  }],
  ["the Luang, the dragon of the north", function (x, y, feel, t, ex, ey) {
    luang(ex - 54 * 1.1 * 0.9, ey + 36 * 1.1 * 0.9, {size: 0.9, face: 1, feel: feel});
  }],
  // the beasts, the same way: the eye from the head's place in the body (beasts.js) and the beast's own scale
  ["an elephant", function (x, y, feel, t, ex, ey) {
    var S = 0.5 * GAITS.elephant[0];
    elephant(ex - 318 * S, ey + 496 * S, {size: 0.5, feel: feel});
  }],
  ["a water buffalo", function (x, y, feel, t, ex, ey) {
    var S = 0.8 * GAITS.buffalo[0];
    buffalo(ex - 286 * S, ey + 284 * S, {size: 0.8, feel: feel});
  }],
  ["a Siamese cat", function (x, y, feel, t, ex, ey) {
    var S = 3 * FELINES.cat.scale;
    cat(ex - 283 * S, ey + 319 * S, {size: 3, feel: feel});
  }],
  ["a tiger", function (x, y, feel, t, ex, ey) {
    var S = 1 * FELINES.tiger.scale;
    tiger(ex - 322 * S, ey + 331 * S, {size: 1, feel: feel});
  }],
  ["a pig", function (x, y, feel, t, ex, ey) {
    var S = 1.2 * GAITS.pig[0];
    pig(ex - 214 * S, ey + 190 * S, {size: 1.2, feel: feel});
  }],
  ["the Hatsadiling", function (x, y, feel, t, ex, ey) {
    var S = 0.6 * GAITS.hatsadiling[0];
    hatsadiling(ex - 176 * S, ey + 448 * S, {size: 0.6, feel: feel});
  }],
  // the birds of the north (northbirds.js): small eyes, so drawn large here
  ["a green peafowl", function (x, y, feel, t, ex, ey) {
    peafowl(ex - 48.5 * 1.6, ey + 247 * 1.6, t, {size: 1.6, feel: feel});
  }],
  ["Mrs Hume's pheasant", function (x, y, feel, t, ex, ey) {
    pheasant(ex - 45 * 2.6, ey + 104 * 2.6, t, {size: 2.6, feel: feel});
  }],
  ["a green-tailed sunbird", function (x, y, feel, t, ex, ey) {
    sunbird(ex - 11 * 6, ey + 23 * 6, t, {size: 6, feel: feel});
  }],
  ["a red-billed blue magpie", function (x, y, feel, t, ex, ey) {
    blueMagpie(ex - 17 * 3.6, ey + 45 * 3.6, t, {size: 3.6, feel: feel});
  }],
  ["a great hornbill", function (x, y, feel, t, ex, ey) {
    hornbill(ex - 35 * 1.8, ey + 123 * 1.8, t, {size: 1.8, feel: feel});
  }],
  ["the sun, with its 1930s face", function (x, y, feel, t, ex, ey) {
    sun(ex + 30, ey + 40, t, {feel: feel});
  }]
];

var TOP = 50, ROW = 515;

function caption(text, x, y, size, colour) {
  pen.fillStyle = colour || "#5a4630";
  pen.textAlign = "center";
  pen.font = size + "px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

function sheet(t) {
  var p = Math.min(PARTS.length - 1, Math.floor(t / 12)), part = PARTS[p];
  pen.fillStyle = "#f3ead8";
  pen.fillRect(0, 0, WIDE, 1080);
  caption("feelings on the creatures: " + part[0] + " (part " + (p + 1) + " of " + PARTS.length + ")", WIDE / 2, 32, 24);
  NAMES.forEach(function (name, n) {
    var left = (n % 5) * WIDE / 5, top = TOP + Math.floor(n / 5) * ROW, wide = WIDE / 5;
    pen.save();
    pen.beginPath();
    pen.rect(left + 4, top, wide - 8, ROW - 62);
    pen.clip();
    part[1](left + wide / 2, top + ROW - 110, name[0], t + n * 0.37, left + wide / 2 - 30, top + 190);
    pen.restore();
    caption(name[0], left + wide / 2, top + ROW - 36, 22, "#3a2418");
    caption(name[1], left + wide / 2, top + ROW - 13, 18);
  });
}

function draw(t) {
  settled(t, function (at) {
    clock = at;
    sheet(at);
  });
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 240, 0);
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
