<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>night - the moon, the barn owl, the atlas moth, bats and fireflies</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {wide: 1920};</script>
<script src="oldcartoon.js"></script>
<script src="cumulus.js"></script>
<script src="northbirds.js"></script>
<script src="night.js"></script>
<script>
// The "night" sheet: night.js. The full moon (nightMoon) among the kit's night clouds; a barn owl flying past it
// (fly: "side"), lit by the moon as it comes near (moonLight) and a silhouette where it is in front of the disc
// (moon); another gliding toward us (fly: "front"), dimmer, far from the moon; one perched on a branch at the left,
// its head turning; an atlas moth fluttering at the right; bats going out over the far hill and behind it
// (batStream, drawn before the hill); and fireflies far off over the fields (farFireflies).
var DURATION = 12;

var BEAT = 0.5;

function caption(text, x, y) {
  pen.fillStyle = "#d8ccb0";
  pen.textAlign = "center";
  pen.font = "22px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

function hill(colour, base, high, wide, x0) {
  pen.fillStyle = colour;
  pen.beginPath();
  pen.moveTo(0, 1080);
  for (var x = 0; x <= WIDE; x += 20) { pen.lineTo(x, base - high * Math.exp(-Math.pow((x - x0) / wide, 2))); }
  pen.lineTo(WIDE, 1080);
  pen.fill();
}

function sheet(t) {
  var sky = pen.createLinearGradient(0, 0, 0, 1080);
  sky.addColorStop(0, "#070b24");
  sky.addColorStop(0.6, "#1b2350");
  sky.addColorStop(1, "#40336b");
  pen.fillStyle = sky;
  pen.fillRect(0, 0, WIDE, 1080);
  var moon = nightMoon(1180, 220, 80);
  cumulus(pen, t * 3, CLOUD_LOOKS.night);
  var ox = -200 + t * 190, oy = 230 + 30 * Math.sin(t * 0.7);   // the owl flying past, across the moon
  barnOwl(ox, oy, t, {fly: "side", size: 0.9, lit: moonLight(ox, oy, moon), moon: moon});
  caption("fly: \"side\", lit by moonLight(), a silhouette over the moon", 1180, 380);
  batStream(t % 12, {from: [1250, 430], to: [1820, 600], count: 40, every: 0.2, long: 7, size: 1.2, far: 0.3, spread: 70});
  hill("#2a3a4a", 760, 220, 380, 1700);
  hill("#1f2c38", 900, 160, 600, 500);
  caption("batStream(): out over the hill and behind it", 1620, 700);
  barnOwl(800, 520, t, {fly: "front", size: 0.7, lit: 0.45});
  caption("fly: \"front\", lit 0.45", 800, 600);
  pen.strokeStyle = "#2a2018";                        // a branch from the left for the perched owl
  pen.lineWidth = 14;
  pen.lineCap = "round";
  pen.beginPath(); pen.moveTo(-20, 420); pen.quadraticCurveTo(140, 400, 300, 430); pen.stroke();
  barnOwl(220, 420, t, {size: 1.1, lit: 0.8});
  caption("perched, lit 0.8", 220, 470);
  atlasMoth(1700, 330, t, {size: 0.6, turn: 0.25 * Math.sin(t * 0.9), lit: 0.9});
  caption("atlasMoth()", 1700, 420);
  pen.fillStyle = "#141c26";                           // the fields, near
  pen.fillRect(0, 900, WIDE, 180);
  farFireflies(t, {box: [0, 860, WIDE, 1060], count: 90});
  caption("farFireflies(): far off over the fields", 960, 1060);
}

function draw(t) {
  settled(t, function (at) {
    clock = at;
    sheet(at);
  });
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 0, 0);
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
