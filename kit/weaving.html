<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>weaving - Lanna cloth thread by thread: the flowing water in the wind, the weavers, the sin and the sabai, every motif</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="oldcartoon.js"></script>
<script src="weaving.js"></script>
<script>
// Five parts of five seconds: the Tai Lue's flowing water woven thread by thread and hung in the wind; the weavers
// at the loom and the spinner at her wheel; the cloths (three sin and two sabai); then every motif of LAI, a swatch
// each with its name. weaving.js says where each comes from.
var PART = 5;
var DURATION = 5 * PART;
var BEAT = 0.5;
var PAPER = "#f3ead8", INKED = "#4a3a28";

function caption(text, x, y, size, align) {
  screen.fillStyle = INKED;
  screen.textAlign = align || "center";
  screen.font = (size || 22) + "px 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif";
  screen.fillText(text, x, y);
}

function partWind(t) {
  caption("ลายน้ำไหล · lai nam lai, the flowing water of the Tai Lue, every thread a line, in the wind", 960, 60, 30);
  threadCloth(screen, 930, 130, t, {warps: 150, picks: 240, gap: 4, wind: 1});
}

function partWorkers(t) {
  caption("ทอผ้า · weaving at the frame loom (หูก)", 330, 70, 24);
  frameLoom(screen, 150, 860, 1.3, t, {id: "weaver-loom"});
  caption("จกด้วยขนเม่น · picking jok with a porcupine quill", 960, 70, 24);
  frameLoom(screen, 770, 860, 1.3, t, {work: "jok", id: "weaver-jok"});
  caption("ปั่นฝ้าย · spinning cotton at the wheel (หลา, ไน)", 1600, 70, 24);
  spinningWheel(screen, 1450, 860, 1.3, t, {id: "spinner"});
}

function partCloths(t) {
  [["maechaem", "ซิ่นตีนจกแม่แจ่ม · Mae Chaem"], ["nan", "ซิ่นตีนจกเมืองน่าน · Nan"], ["long", "ซิ่นตีนจกเมืองลอง · Mueang Long"]].forEach(function (s, k) {
    caption(s[1], 230 + k * 420, 60, 22);
    sinCloth(screen, 40 + k * 420, 90, {town: s[0], w: 380, cell: 3.4});
  });
  caption("สไบขิด · a khit sabai", 1480, 60, 22);
  sabaiCloth(screen, 1480, 120, {palette: "khit", motifs: ["kho", "chang", "dokChan"], drop: 760, w: 170, t: t});
  caption("สไบน้ำไหล · Tai Lue", 1770, 60, 22);
  sabaiCloth(screen, 1770, 120, {palette: "lue", motifs: ["phuKhao", "that"], body: WEAVE_DYES.red, drop: 700, w: 150, t: t + 1});
}

function partSamples(from) {
  LAI_ORDER.slice(from, from + 30).forEach(function (key, k) {
    var lai = LAI[key], g = lai.grid, gw = g[0].length, across = gw <= 13 ? 3 : (gw <= 20 ? 2 : 1);
    var cols = across * gw + (across + 1) * 2, rows = g.length + 4;
    var cell = Math.min(8, 270 / cols, 125 / (rows * 0.62));
    var cx = 160 + (k % 6) * 320, cy = 30 + Math.floor(k / 6) * 210, w = cols * cell;
    clothSample(screen, cx - w / 2, cy + 18, {motif: key, palette: lai.town.indexOf("khit") === 0 ? "khit" : (/Lue/.test(lai.town) ? "lue" : (/Long/.test(lai.town) ? "long" : (/Nan/.test(lai.town) ? "nan" : "maechaem"))),
                                              cell: cell, across: across, down: 1});
    caption(lai.thai + " · " + lai.say, cx, cy + 172, 17);
    caption(lai.en.length > 46 ? lai.en.slice(0, 44) + "…" : lai.en, cx, cy + 192, 14);
  });
}

function draw(t) {
  screen.fillStyle = PAPER;
  screen.fillRect(0, 0, 1920, 1080);
  var part = Math.floor(t / PART) % 5, at = t % PART;
  if (part === 0) { partWind(t); }
  if (part === 1) { partWorkers(t); }
  if (part === 2) { partCloths(t); }
  if (part === 3) { partSamples(0); }
  if (part === 4) { partSamples(30); }
}

var rendering = false;
function play(now) { if (!rendering) { draw((now / 1000) % DURATION); } requestAnimationFrame(play); }
requestAnimationFrame(play);
</script>
</body>
</html>
