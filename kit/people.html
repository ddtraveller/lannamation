<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>people - the twenty painted people on person(), and new women from the generator</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {hop: false, wide: 1920};</script>
<script src="oldcartoon.js"></script>
<script src="weaving.js"></script>
<script src="people.js"></script>
<script>
// The "people" sheet: the twenty of people.js by their names in cast(), drawn by person(). From 0 s the ten women; from 8 s the
// six men; from 12 s the four children; from 16 s all twenty walking in place; from 28 s new women from the generator, five every four seconds (castMix);
// from 48 s the women large, from 52 s their woven hems (teen jok), from 55 s the three woven sin (chevron, teal, the flowing water), each laid flat and worn,
// from 58 s the 23 woven sabai, from 61 s two men of the mural (the flat top, knee trousers, the pha khao ma round the neck), from 64 s the men's heads,
// from 67 s the children's, from 70 s the hands, from 73 s a face in each feeling, from 76 s an old face in each, from 79 s women seated, from 83 s at the
// wheel and the loom, from 87 s the same, large.
var DURATION = 91;
var BEAT = 0.5;
var WOMEN = ["heavenly", "lotusmaiden", "naildancer", "orchiddancer", "princess", "khangran", "clothweaver", "luewoman", "courtlady", "festivalgirl"];
var MEN = ["polefarmer", "longdrummer", "swordsman", "townsman", "whiteelder", "lueman"];
var CHILDREN = ["jukboy", "kaegirl", "piagirl", "poyprince"];
var ALL = WOMEN.concat(MEN, CHILDREN);

function caption(text, x, y) {
  pen.fillStyle = "#f6eedc";
  pen.textAlign = "center";
  pen.font = "21px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

function row(names, size) {
  names.forEach(function (name, n) {
    var x = WIDE * (n + 0.5) / names.length;
    person(x, 1000, cast(name, {size: size, id: "r-" + name}));
    caption(name, x, 1040);
  });
}

// everyone walking in place, two rows, the second row facing left
function parade(t) {
  ALL.forEach(function (name, n) {
    var far = n >= 10, x = WIDE * ((far ? n - 10 : n) + 0.5) / 10;
    person(x, far ? 1040 : 520, cast(name, {size: 1.05, id: "w-" + name, step: t * 0.8, stride: 1, face: far ? -1 : 1}));
  });
}

// ---- what the sheets of the separate figure showed ----
var TOWNS = {maechaem: "Mae Chaem", nan: "Nan", long: "Mueang Long"};
var THREADS = {maechaem: "on black", maechaemRed: "on red", nan: "silver on black", nanIndigo: "gold on indigo",
               long: "jackfruit and lac on indigo", lue: "Tai Lue colours on red", khit: "indigo on white"};
var FEELS = ["neutral", "happy", "laughing", "sad", "concerned", "thinking", "angry", "sleepy", "satiated", "surprised", "fear", "awe"];

function words(text, x, y, size, colour) {
  pen.fillStyle = colour || "#f6eedc";
  pen.textAlign = "center";
  pen.font = size + "px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

// the settings a name of the twenty's was made from
function made(name) { var who = PEOPLE_CAST[name]; return (who[0] === "woman" ? MURAL_WOMEN : who[0] === "man" ? MURAL_MEN : MURAL_CHILDREN)[who[1]]; }

// the ten women on cards: drawn at "size", feet at "feet" below the card's top; under each, the words of say(name)
function sheetCards(size, feet, say) {
  WOMEN.forEach(function (name, n) {
    var col = n % 5, line = Math.floor(n / 5), cw = WIDE / 5, cx = cw * (col + 0.5), top = 14 + line * 533, ch = 520;
    pen.save();
    pen.beginPath(); pen.rect(cw * col + 8, top, cw - 16, ch); pen.clip();
    pen.fillStyle = "rgba(246, 236, 214, 0.16)"; pen.fillRect(cw * col + 8, top, cw - 16, ch);
    person(cx - 14, top + feet, cast(name, {size: size, id: "c-" + name}));
    pen.fillStyle = "rgba(20, 16, 12, 0.55)"; pen.fillRect(cw * col + 8, top + ch - 56, cw - 16, 56);
    pen.restore();
    words(name, cx, top + ch - 32, 19);
    words(say(name), cx, top + ch - 11, 14, "#d8ccb4");
  });
}

function sheetWeaves() {
  var names = Object.keys(SABAI_WEAVES), per = 12;
  names.forEach(function (name, n) {
    var line = Math.floor(n / per), col = n % per, x = WIDE * (col + 0.5) / per + (line ? WIDE / per / 2 : 0), y = line ? 1030 : 500;
    person(x - 6, y, cast("maiden", {shirt: "#f1e6d6", sin: n % 3, sabai: sabaiLook(name), jewels: "gold", size: 0.62, id: "w-" + n,
                                     woman: {hair: ["jasmine"], earring: "pearl", neck: "pearls", chain: false}}));
    words(name, x, y + 26, 15);
  });
  words("the 23 woven sabai, each painted once and worn", WIDE / 2, 36, 24);
}

function sheetHeads(names, size, feet) {
  names.forEach(function (name, n) {
    var cw = WIDE / names.length, x = cw * (n + 0.5);
    pen.save(); pen.beginPath(); pen.rect(cw * n + 6, 14, cw - 12, 990); pen.clip();
    person(x - 20, feet, cast(name, {size: size, id: "h-" + name}));
    pen.restore();
    words(made(name).say, x, 1040, 17);
  });
}

function sheetHands() {
  var skin = "#c48a5c";
  MU_PX = 9;                                         // the painter reads it: not whatever the last figure left
  [["the dancer's hand", false, 0.55], ["an ordinary hand, at rest", true, 0.4], ["an ordinary hand, gripping", true, 1]].forEach(function (h, n) {
    var x = 320 + n * 640;
    pen.save(); pen.translate(x, 260); pen.scale(9, 9);
    if (h[1]) { wmHandNormal(0, 0, Math.PI / 2, 1, h[2], skin, false); } else { WM_KIT.muHand(0, 0, Math.PI / 2, 1, h[2], skin, false); }
    pen.restore();
    words(h[0], x, 1000, 26);
  });
}

// a head alone, large, as person() would dress it
function head(look, x, y, scale) {
  var lady = !!look.bun, skin = look.skin || STYLE.skin;
  if (lady) { skin = blend(skin, "#f6ead8", MU.skinLady); }
  TH_SKINS[muColour(skin)] = true;
  muDress(look);
  MU_PX = scale;
  pen.save(); pen.translate(x, y); pen.scale(scale, scale);
  muHead(look, lady, skin);
  pen.restore();
}

function sheetFeelings(who) {
  FEELS.forEach(function (feel, n) {
    var x = WIDE * ((n % 6) + 0.5) / 6, y = 420 + Math.floor(n / 6) * 520;
    head(cast(who, feel === "neutral" ? {} : {feel: feel}), x + 30, y, 2.8);
    words(feel, x, y + 70, 22);
  });
}

// a plain bench of bamboo, its seat "high" above the ground at (x, y), "wide" long
function bench(x, y, high, wide) {
  weaveBeam(pen, x - wide / 2 + 10, y, x - wide / 2 + 10, y - high + 4, 8);
  weaveBeam(pen, x + wide / 2 - 10, y, x + wide / 2 - 10, y - high + 4, 8);
  weaveBeam(pen, x - wide / 2, y - high, x + wide / 2, y - high, 11);
}

function sheetSeated() {
  [["clothweaver", "astride"], ["khangran", true], ["courtlady", "astride"], ["festivalgirl", true]].forEach(function (s, n) {
    var x = WIDE * (n + 0.5) / 4 - 60, size = 1.45, high = 190 * 0.59 * size;
    if (s[1] === "astride") { bench(x, 960, high, 170 * size); }
    person(x, s[1] === "astride" ? 960 - high : 960, cast(s[0], {floor: s[1], size: size, id: "s-" + s[0]}));
    words(s[0], x + 60, 1030, 20);
  });
}

// the three sin woven from waist to foot (weaving.js TEEN_JOK_ROWS chevron, teal, namLai): each laid flat, its white head
// and red band above, and worn by the lotus maiden (WM_SIN of the same name, her jok the same rows); in the teal, after the
// photograph it came from, she carries water pots on a pole (holds "pots")
function sheetWovenSins() {
  [["chevron", "chevron"], ["teal", "teal"], ["namLai", "lueLac"]].forEach(function (s, n) {
    var cx = WIDE * (n + 0.5) / 3, base = cast("lotusmaiden");
    weaveGround(pen, cx - 300, 90, 250, 40, WEAVE_DYES.white, 3, 1);
    weaveGround(pen, cx - 300, 130, 250, 8, SIN_HEAD_BAND, 3, 2);
    teenJok(pen, cx - 300, 138, 250, {town: s[0], palette: WEAVE_PALETTES[s[1]], cell: 3.4});
    var look = Object.assign({}, base, {size: 1.55, id: "sin-" + s[0], sin: WM_SIN[s[0]]});
    look.woman = Object.assign({}, peopleSettings(base), {jok: [s[0], s[1], 1], holds: null});
    if (s[0] === "teal") { Object.assign(look.woman, {holds: "pots", hands: "normal", pose: {near: WM_POTS.hand}}); }
    person(cx + 140, 1050, look);
    caption(s[0], cx - 175, 60);
  });
}

// two men as the mural paints them (people.js: hairdo "flattop", trousers [cloth, flowers], khaoma), large and small
function sheetMuralMen() {
  [["#e6a0b4", "#b8323a"], ["#7a9ad0", "#f2ead6"]].forEach(function (cloth, n) {
    var cx = WIDE * (n + 0.5) / 2, base = castMan("drummer"), set = MURAL_MEN.drummer.man;
    [[cx - 60, 1.45, "mm-"], [cx + 200, 0.55, "mms-"]].forEach(function (at) {
      var look = Object.assign({}, base, {size: at[1], id: at[2] + n, turban: null, sarong: cloth[0], patoi: true, sabai: undefined, tattoo: false});
      look.man = Object.assign({}, set, {holds: null, pose: null, khaoma: ["#2c8c8e", "#1d3f6e"], trousers: cloth,
                                         face: Object.assign({}, set.face, {hairdo: "flattop"})});
      person(at[0], 1040, look);
    });
  });
}

function sheetWork(t, size, base, places) {
  spinningWheel(pen, places[0], base, size, t, {id: "wheel", weaver: Object.assign({}, MURAL_WOMEN.grandmother.look, {woman: "grandmother"})});
  frameLoom(pen, places[1], base, size, t, {id: "loom", weaver: Object.assign({}, MURAL_WOMEN.weaver.look, {woman: "weaver"}), cloth: "maechaem"});
  words("at the spinning wheel, on the floor", places[0] + 60 * size, base + 50, 22);
  words("at the frame loom, on its bench", places[1] + 140 * size, base + 50, 22);
}

function draw(t) {
  clock = t;
  thGround(0, 0, WIDE, 1080);
  if (t < 4) { row(WOMEN.slice(0, 5), 1.55); }
  else if (t < 8) { row(WOMEN.slice(5), 1.55); }
  else if (t < 12) { row(MEN, 1.45); }
  else if (t < 16) { row(CHILDREN, 1.2); }
  else if (t < 28) {
    parade(t);
  } else if (t < 48) {
    var slot = Math.floor((t - 28) / 4);
    for (var n = 0; n < 5; n++) {
      var x = WIDE * (n + 0.5) / 5;
      person(x, 1000, castMix(1000 + slot * 7 + n, {size: 1.55, id: "m-" + slot + "-" + n}));
      caption("castMix(" + (1000 + slot * 7 + n) + ")", x, 1040);
    }
  }
  else if (t < 52) { sheetCards(3.6, 245 + 650 * 2.12, function (name) { return made(name).say; }); }
  else if (t < 55) { sheetCards(3.2, 456, function (name) { var j = made(name).woman.jok; return "teen jok of " + TOWNS[j[0]] + ", " + THREADS[j[1]]; }); }
  else if (t < 58) { sheetWovenSins(); }
  else if (t < 61) { sheetWeaves(); }
  else if (t < 64) { sheetMuralMen(); }
  else if (t < 67) { sheetHeads(MEN, 3.2, 1690); }
  else if (t < 70) { sheetHeads(CHILDREN, 3.2, 1520); }
  else if (t < 73) { sheetHands(); }
  else if (t < 76) { sheetFeelings("buakham"); }
  else if (t < 79) { sheetFeelings("grandmother"); }
  else if (t < 83) { sheetSeated(); }
  else if (t < 87) { sheetWork(t, 1, 900, [300, 1100]); }
  else { sheetWork(t, 2, 1000, [180, 1000]); }
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 0, 0);
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
