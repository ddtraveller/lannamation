<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>mural men - six Lanna men and four children of the mural figure, each his or her own</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {hop: false, wide: 1920, figure: "mural"};</script>
<script src="oldcartoon.js"></script>
<script src="weaving.js"></script>
<script src="mural.js"></script>
<script src="mural_luxe.js"></script>
<script src="mural_thangka.js"></script>
<script src="mural_women.js"></script>
<script src="mural_men.js"></script>
<script>
// The "mural men" sheet: the six men and four children of mural_men.js (MURAL_MEN, MURAL_CHILDREN), drawn by person()
// as any page draws its people (castMan, castChild). From 0 s the men; from 4 s the children, at a child's height beside
// a woman and a man; from 8 s the men's heads and shoulders; from 12 s the children's; from 16 s the mural's dancer's
// hand beside the ordinary hand, at rest and gripping. Nothing here moves by a spring, so draw() needs no settled().
var DURATION = 19;
var BEAT = 0.5;

function caption(text, x, y, size, colour) {
  pen.fillStyle = colour || "#f6eedc";
  pen.textAlign = "center";
  pen.font = (size || 20) + "px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

var MEN = Object.keys(MURAL_MEN), CHILDREN = Object.keys(MURAL_CHILDREN);
// a child drawn at the cast's measure of a child to a grown man (a boy 0.8, a girl 0.78, a man 1.3)
function childSize(name, man) { return man * (CAST[MURAL_CHILDREN[name].cast].size || 1) / 1.3; }

function sheetMen() {
  thGround(0, 0, WIDE, 1080);
  MEN.forEach(function (name, n) {
    var x = WIDE * (n + 0.5) / MEN.length;
    person(x - 10, 1000, castMan(name, {size: 1.4, id: "m-" + name}));
    caption(MURAL_MEN[name].say, x, 1040, 18);
  });
}

function sheetChildren() {
  thGround(0, 0, WIDE, 1080);
  person(200, 1000, castWoman("weaver", {size: 1.4, id: "c-weaver"}));
  person(420, 1000, castMan("townsman", {size: 1.4, id: "c-townsman"}));
  CHILDREN.forEach(function (name, n) {
    var x = 680 + n * 330;
    person(x, 1000, castChild(name, {size: childSize(name, 1.4), id: "c-" + name}));
    caption(MURAL_CHILDREN[name].say, x, 1040, 17);
  });
}

function sheetHeads(names, look, size, feet, say) {
  thGround(0, 0, WIDE, 1080);
  names.forEach(function (name, n) {
    var cw = WIDE / names.length, x = cw * (n + 0.5);
    pen.save(); pen.beginPath(); pen.rect(cw * n + 6, 14, cw - 12, 990); pen.clip();
    person(x - 20, feet, look(name, size, "h-" + name));
    pen.restore();
    caption(say(name), x, 1040, 17);
  });
}

function sheetHands() {
  thGround(0, 0, WIDE, 1080);
  var skin = "#c48a5c";
  [["the mural's hand", false, 0.55], ["an ordinary hand, at rest", true, 0.4], ["an ordinary hand, gripping", true, 1]].forEach(function (h, n) {
    var x = 320 + n * 640;
    pen.save(); pen.translate(x, 260); pen.scale(9, 9);
    if (h[1]) { wmHandNormal(0, 0, Math.PI / 2, 1, h[2], skin, false); } else { WM_KIT.muHand(0, 0, Math.PI / 2, 1, h[2], skin, false); }
    pen.restore();
    caption(h[0], x, 1000, 26);
  });
}

function draw(t) {
  clock = t;
  if (t < 4) { sheetMen(); }
  else if (t < 8) { sheetChildren(); }
  else if (t < 12) { sheetHeads(MEN, function (n, s, id) { return castMan(n, {size: s, id: id}); }, 3.2, 1690, function (n) { return MURAL_MEN[n].say; }); }
  else if (t < 16) { sheetHeads(CHILDREN, function (n, s, id) { return castChild(n, {size: childSize(n, s), id: id}); }, 5.2, 1520, function (n) { return MURAL_CHILDREN[n].say; }); }
  else { sheetHands(); }
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 0, 0);
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
