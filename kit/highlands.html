<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>highlands - rice terraces, the forest, and mist in the valleys and on the mountains</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {hop: false, wide: 1920};</script>
<script src="oldcartoon.js"></script>
<script src="highlands.js"></script>
<script>
// The "highlands" sheet: what highlands.js draws. From 0 s, a valley of the
// north at sunrise made of its parts: far ranges in forest with a sea of mist
// lying between them, a mountain with rice terraces and a hut cut into it,
// bands of mist drifting across its face, and the forest near at the right.
// From 8 s, the parts on paper, each with how it is called: the terraces in
// their four seasons; a crown, a tall tree, bamboo, an areca palm and the
// hut; a belt of forest near and far; and the mist on a dark ground.
var DURATION = 16;

var BEAT = 0.5;

function caption(text, x, y) {
  pen.fillStyle = "#5a4630";
  pen.textAlign = "center";
  pen.font = "21px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

function sheetOf(paint) {                          // a set painted once, on a sheet of its own
  var sheet = document.createElement("canvas");
  sheet.width = WIDE;
  sheet.height = 1080;
  paint(sheet.getContext("2d"));
  return sheet;
}

function farRidge(x) { return 470 + 38 * Math.sin(x / 310 + 1) + 22 * Math.sin(x / 127); }
function midRidge(x) { return 600 + 45 * Math.sin(x / 240 + 4) + 16 * Math.sin(x / 85 + 1); }
function mountainRidge(x) {                        // a broad face for the terraces, falling away to the right into the valley
  var fall = x > 1000 ? 0.0012 * (x - 1000) * (x - 1000) : 0;
  return 330 + 0.00035 * (x - 520) * (x - 520) + fall + 14 * Math.sin(x / 70);
}
var SUNRISE = "#f6c27a";

var VALLEY = null;
function valleySets() {                            // the valley's sets, from the back: each is laid down whole, and the mist goes between them
  return {
    far: sheetOf(function (b) {
      var sky = b.createLinearGradient(0, 0, 0, 600);
      sky.addColorStop(0, "#5f8fc4");
      sky.addColorStop(0.75, "#f7c98a");
      sky.addColorStop(1, "#fbe3b0");
      b.fillStyle = sky;
      b.fillRect(0, 0, WIDE, 1080);
      var sun = b.createRadialGradient(1480, 470, 10, 1480, 470, 260);
      sun.addColorStop(0, "rgba(255, 244, 210, 0.95)");
      sun.addColorStop(0.15, "rgba(255, 226, 160, 0.7)");
      sun.addColorStop(1, "rgba(255, 226, 160, 0)");
      b.fillStyle = sun;
      b.fillRect(1200, 200, 560, 560);
      forestSlope(b, farRidge, 0, WIDE, 700, {far: 0.9, small: 4, large: 7, seed: 3, haze: "#b9c8d6"});
    }),
    middle: sheetOf(function (b) {
      forestSlope(b, midRidge, 0, WIDE, 1080, {far: 0.6, small: 5, large: 11, seed: 4, haze: "#b9c8d6"});   // down to the valley's floor, under the mist
    }),
    mountain: sheetOf(function (b) {
      forestSlope(b, mountainRidge, 0, 1560, 1080, {far: 0.15, small: 8, large: 26, seed: 5});
      terraces(b, 560, 460, 600, 360, {season: "green", hut: true, seed: 2});
    }),
    near: sheetOf(function (b) {
      forest(b, 1560, WIDE + 300, 1080, {tall: 400, seed: 6});
      forest(b, -60, WIDE + 60, 1110, {tall: 150, seed: 7, trees: 0, palms: 0, bamboo: 2});
    })
  };
}

function sceneValley(t) {
  if (!VALLEY) { VALLEY = valleySets(); }
  pen.drawImage(VALLEY.far, 0, 0);
  mistSea(pen, t, {level: 548, deep: 80, swell: 8, wave: 90, layers: 1, glow: SUNRISE, drift: 4, seed: 1});   // between the far ranges
  pen.drawImage(VALLEY.middle, 0, 0);
  mistSea(pen, t, {level: 730, deep: 170, layers: 3, glow: SUNRISE, drift: 6, seed: 2});   // the sea of mist in the valley
  pen.drawImage(VALLEY.mountain, 0, 0);
  mistDrift(pen, t, {left: 0, right: 1300, top: 420, bottom: 760, count: 6, drift: 12, seed: 3});    // and across the mountain's face
  pen.drawImage(VALLEY.near, 0, 0);
}

var PARTS = null;
var SEASONS = ["green", "gold", "water", "dry"];
function partsSet() {
  return sheetOf(function (b) {
    var keep = pen;
    pen = b;                                       // caption() writes on "pen"
    b.fillStyle = "#f3ead8";
    b.fillRect(0, 0, WIDE, 1080);
    SEASONS.forEach(function (season, n) {         // the terraces, in their four seasons
      var x = 240 + n * 480;
      b.fillStyle = "#3f6a4a";                     // a little of the slope they are cut into
      b.beginPath();
      b.moveTo(x - 230, 400);
      b.quadraticCurveTo(x, 20, x + 230, 400);
      b.closePath();
      b.fill();
      terraces(b, x, 70, 400, 300, {season: season, count: 9, hut: season === "green", seed: n + 1});
      caption('season: "' + season + '"', x, 430);
    });
    caption("terraces(brush, x, top, wide, tall, look)", 960, 470);
    crown(b, 90, 640, 18, FOREST_GREENS[0], 1);
    crown(b, 170, 640, 34, FOREST_GREENS[2], 2);
    crown(b, 70, 760, 50, FOREST_TINTS[2], 3);
    caption("crown", 110, 1000);
    tallTree(b, 330, 1000, 1.05, FOREST_GREENS[1], 4);
    caption("tallTree", 330, 1040);
    bamboo(b, 520, 1000, 1.0, 5);
    caption("bamboo", 520, 1040);
    areca(b, 690, 1000, 1.0, 6);
    caption("areca", 690, 1040);
    fieldHut(b, 840, 1000, 1.3);
    caption("fieldHut", 840, 1040);
    forest(b, 940, 1900, 790, {tall: 260, seed: 8});
    forest(b, 940, 1420, 1000, {tall: 160, far: 0.7, seed: 9});
    caption("forest(brush, left, right, base, {tall})", 1420, 820);
    caption("..., far: 0.7", 1180, 1040);
    b.fillStyle = "#3d5266";                       // a dark ground, for the mist to show on
    b.fillRect(1440, 850, 470, 210);
    pen = keep;
  });
}

function sceneParts(t) {
  if (!PARTS) { PARTS = partsSet(); }
  pen.drawImage(PARTS, 0, 0);
  pen.save();
  pen.beginPath();
  pen.rect(1440, 850, 470, 210);
  pen.clip();
  mistSea(pen, t, {left: 1440, right: 1910, level: 990, deep: 70, swell: 10, wave: 100, layers: 2, drift: 14, seed: 4});
  mistBand(pen, 1675, 910, 300, t, {seed: 5});
  pen.restore();
  caption("mistSea, mistBand, mistDrift", 1675, 838);
}

function sheet(t) {
  if (t < 8) { sceneValley(t); } else { sceneParts(t - 8); }
}

function draw(t) {
  settled(t, function (at) {
    clock = at;
    sheet(at);
  });
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 0, 0);
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
