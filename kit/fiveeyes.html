<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>fiveeyes - the creature with four ears and five eyes</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="oldcartoon.js"></script>
<script src="naga.js"></script>
<script src="beasts.js"></script>
<script src="myth.js"></script>
<script>
// The "fiveeyes" sheet: the creature with four ears and five eyes of myth.js
// (แมงสี่หูห้าตา, maengSiHuHaTa). Above, in two rows: the kit's ten feelings
// (feel). Below: it walks behind a boy at a film's size (amble), and it
// catches an ember that flies to it, chews it, and its five eyes light up
// (mouth, glow).
var DURATION = 20;
var BEAT = 0.5;
var FELT = ["neutral", "happy", "laughing", "sad", "concerned", "angry", "sleepy", "satiated", "surprised", "fear"];
function caption(text, x, y) {
  pen.fillStyle = "#5a4630";
  pen.textAlign = "center";
  pen.font = "22px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}
// The ember's four seconds: it flies from (fx, fy) into the mouth on a curve, the jaw open to take it, then the
// creature chews with its eyes lit, and they fade.
function ember(t) {
  var u = t % 4, fly = between(u, 0.6, 1.4);
  var open = u < 0.4 ? u / 0.4 * 0.8 : u < 1.5 ? 0.8 : u < 2.6 ? 0.25 + 0.2 * Math.abs(Math.sin((u - 1.5) * 9)) : Math.max(0, 0.25 - (u - 2.6));
  var glow = u < 1.5 ? 0 : u < 2.0 ? (u - 1.5) / 0.5 : u < 3.2 ? 1 : Math.max(0, 1 - (u - 3.2) / 0.8);
  return {open: open, glow: glow, fly: fly > 0 && fly < 1 ? fly : null};
}
function sheet(t) {
  pen.fillStyle = "#f3ead8";
  pen.fillRect(0, 0, WIDE, 1080);
  FELT.forEach(function (feel, n) {                  // the feelings, two rows of five
    var x = 150 + (n % 5) * 285, y = 300 + Math.floor(n / 5) * 290;
    maengSiHuHaTa(x, y, {size: 0.42, feel: feel});
    caption(feel, x, y + 34);
  });
  var bite = ember(t), low = 1000;
  var eats = maengSiHuHaTa(1200, low, {size: 0.5, face: -1, mouth: bite.open, glow: bite.glow});
  if (bite.fly !== null) {                           // the ember, on a curve from the right to the mouth the creature gives back
    var ex = mix(1410, eats.mouth[0], bite.fly), ey = mix(900, eats.mouth[1], bite.fly) - 120 * Math.sin(Math.PI * bite.fly);
    pen.fillStyle = "rgba(255, 170, 60, 0.35)";
    pen.beginPath();
    pen.arc(ex, ey, 16, 0, 7);
    pen.fill();
    oval(ex, ey, 7, 6, "#ff6a1a");
    oval(ex - 2, ey - 2, 3, 3, "#ffd27a");
  }
  caption("mouth, glow: an ember to its mouth", 1180, low + 40);
  var boy = stroll(t % 10, 330, 820, 0, cast("boy", {size: 0.9, smile: 1, id: "boy"}));
  person(boy.x, low, boy.look);
  var follower = amble("maengSiHuHaTa", t % 10, 90, 600, 0.2, {size: 0.42, feel: "happy"});
  maengSiHuHaTa(follower.x, low, follower.look);
  caption("walking (amble), at a film's size beside a boy", 450, low + 40);
}
function draw(t) {
  settled(t, function (at) {                         // so that a still shows what hangs as the moving sheet has it
    clock = at;
    sheet(at);
  });
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 240, 0);
}
var rendering = false;
function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}
requestAnimationFrame(play);
</script>
</body>
</html>
