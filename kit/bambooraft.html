<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bambooraft - a bamboo raft on a river</title>
<style>html, body { margin: 0; background: #111; } canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {wide: 1920, pixels: 2, film: 0.3, light: [-0.6, 0.5]};</script>
<script>var BEAT = 0.5;</script>
<script src="oldcartoon.js"></script>
<script src="flora.js"></script>
<script src="butterflies.js"></script>
<script src="northbirds.js"></script>
<script src="thicket.js"></script>
<script src="highlands.js"></script>
<script src="pinewoods.js"></script>
<script src="wildplaces.js"></script>
<script>
// The "bambooraft" sheet: wildplaces.js. A raft of lashed bamboo on a river among the hills, as on the Pai: the
// water mirroring the hills (natReflect()), the raft rocking (bambooRaft()), a boatman poling it, the pole drawn through
// his hands where person() puts them (its joints come back in device pixels: divided by PIX).
var DURATION = 12;
var PATH = [];
(function () {                                      // the walkway's line: from a hut far off, winding toward us
  for (var n = 0; n <= 40; n++) {
    var u = n / 40, y = 640 + 460 * u * u, w = 18 + 260 * u * u;
    PATH.push([1180 - 520 * u + 160 * Math.sin(u * 4.2) * (1 - u * 0.6), y, w]);
  }
})();
function build() {
  var n, rows = [], near = [];
  var BLUE = THK_SHADE.map(function (g) { return blend(g, "#7a9aaa", 0.4); });
  var hillFar = forestHill({seed: 111, tall: 300, deep: 80, gap: 30, greens: BLUE, sizes: ["small"], pines: 0});
  var hillNear = forestHill({seed: 115, tall: 190, deep: 90, gap: 34, greens: THK_SHADE, sizes: ["small", "medium"], pines: 6, pineHigh: 160});
  var rice = [0, 1, 2, 3].map(function (k) {
    return thkSprite(700, 320, 350, 290, function () { grassBank(620, 110 + 30 * dice(k), 171 + k, k % 2 ? ["#3a5a14", "#4e7018", "#66861e", "#80a024", "#9cb82e", "#b8cc44", "#d4dc6a"] : ["#40601a", "#56781e", "#6e9024", "#8aa82a", "#a6c034", "#c2d24a", "#dce272"], 0); });
  });
  for (var y = 650; y < 1180; y += 10 + 0.06 * (y - 650)) {   // the rice, row on row, bigger as it comes near
    var q = (y - 650) / 430, size = 0.12 + 0.9 * q * q;
    var onPath = PATH.reduce(function (best, p2) { return Math.abs(p2[1] - y) < Math.abs(best[1] - y) ? p2 : best; });
    for (var x = -300; x < WIDE + 300; x += 360 * size + 10) {
      var rx = x + 60 * dice(y + x);
      if (Math.abs(rx - onPath[0]) < onPath[2] * 0.5 + 280 * size) { continue; }   // the walkway's line is left clear
      rows.push({sprite: rice[Math.floor(dice(x * 0.1 + y) * 4)], x: rx, y: y, size: size, reach: 0.15 + 0.2 * q});
    }
  }
  var hut = thkSprite(600, 520, 300, 500, function () { fieldHut(pen, 0, 0, 1.3); });
  var paddy = thkSprite(3400, 600, 300, 20, function () {
    var g = pen.createLinearGradient(0, 0, 0, 560);
    g.addColorStop(0, "#9ab848");
    g.addColorStop(1, "#4e7018");
    pen.fillStyle = g;
    pen.fillRect(-300, 0, 3400, 600);
  });
  return [
    {depth: 0.05, blur: 1, haze: 0.3, items: [{sprite: hillFar.sprite, x: -300, y: 600, reach: 0}]},
    {depth: 0.1, blur: 0.6, haze: 0.12, items: [{sprite: hillNear.sprite, x: -300, y: 650, reach: 0}], live: function (t) { softMist(t, 655, 50, 0.45, 3); }},
    {depth: 0.3, blur: 0, items: [{sprite: paddy, x: -300, y: 640, reach: 0}, {sprite: hut, x: PATH[0][0] + 10, y: PATH[0][1] + 6, size: 0.28, reach: 0}]},
    {depth: 0.3, blur: 0, items: rows},
    {depth: 0.3, blur: 0, items: [], live: function (t) {
      bambooWalk(PATH, {post: 30, rail: true});
      var k = Math.floor(((t * 0.06) % 0.7) * 40), at = PATH[Math.min(39, 8 + k)];   // a farmer walking out along it
      person(at[0], at[1], cast("farmer", {id: "walker", face: -1, size: at[2] / 300, step: t * 2}));
    }}
  ];
}
var SHOW = "raft";
var RIVER = 700;
function buildRiver() {                             // the raft: a river among the hills, the water mirroring them
  var BLUE = THK_SHADE.map(function (g) { return blend(g, "#7a9aaa", 0.4); });
  var hillFar = forestHill({seed: 121, tall: 320, deep: 60, gap: 30, greens: BLUE, sizes: ["small"], pines: 0});
  var hillNear = forestHill({seed: 125, tall: 200, deep: 40, gap: 34, greens: THK_SHADE, sizes: ["small", "medium"], pines: 10, pineHigh: 200});
  var bank = forestHill({seed: 129, tall: 70, deep: 20, gap: 30, greens: THK_GREENS, sizes: ["small", "medium"], pines: 0});
  return [
    {depth: 0.05, blur: 1, haze: 0.3, items: [{sprite: hillFar.sprite, x: -300, y: RIVER - 70, reach: 0}]},
    {depth: 0.1, blur: 0.6, haze: 0.12, items: [{sprite: hillNear.sprite, x: -300, y: RIVER - 20, reach: 0}], live: function (t) { softMist(t, RIVER - 30, 50, 0.4, 3); }},
    {depth: 0.15, blur: 0.3, items: [{sprite: bank.sprite, x: -300, y: RIVER, reach: 0}]}
  ];
}
function sceneRiver(at) {
  var layers = thkOnce("river", buildRiver);
  var sky = pen.createLinearGradient(0, 0, 0, RIVER);
  sky.addColorStop(0, "#6aa0d0");
  sky.addColorStop(0.7, "#c4dcea");
  sky.addColorStop(1, "#eef2e4");
  pen.fillStyle = sky;
  pen.fillRect(0, 0, WIDE, 1080);
  natCloud(at, 360, 300, 320, 31, 0.9);
  natCloud(at, 1300, 220, 420, 37, 0.85);
  thkLayers(at, layers, {x: 10 * at, z: 0, y: 0}, "#eef2e4");
  natReflect(at, RIVER, {ripple: 1.2, tint: "60, 66, 40", deep: 0.55});
  var rx = 300 + 60 * at, deck = bambooRaft(rx, 900, 1.4, at, 1);
  var pole = 0.5 + 0.5 * Math.sin(at * 1.2);        // the boatman pushing with his long pole, both hands on it
  var foot = [deck[0] - 60, deck[1]];
  var j = person(foot[0], foot[1], cast("farmer", {id: "boatman", face: 1, size: 0.75, bend: 0.12 + 0.12 * pole, grip: true,
                 reachA: [foot[0] + 30 + 10 * pole, foot[1] - 215], reachB: [foot[0] + 55 + 20 * pole, foot[1] - 140]}));
  var a = [j.wristA[0] / PIX, j.wristA[1] / PIX], b = [j.wristB[0] / PIX, j.wristB[1] / PIX];   // joints come back in device pixels
  var dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
  if (dy / l < 0.6) { dx = 0.35; dy = 0.94; l = 1; }   // hands too level to set the pole's slant: a steep pole through the upper hand
  var down = (deck[1] + 70 - a[1]) / (dy / l);       // the pole through his hands as they truly are, down into the water
  pen.strokeStyle = "#a8904a";
  pen.lineWidth = 5;
  pen.lineCap = "round";
  pen.beginPath();
  pen.moveTo(a[0] - dx / l * 170, a[1] - dy / l * 170);
  pen.lineTo(a[0] + dx / l * down, a[1] + dy / l * down);
  pen.stroke();
  thkLight(at, 0.3, 21);
  thkVignette(0.22);
}
function scene(at) {
  if (SHOW === "raft") { sceneRiver(at); return; }
  var layers = thkOnce("bamboo", build);
  var sky = pen.createLinearGradient(0, 0, 0, 640);
  sky.addColorStop(0, "#6aa0d0");
  sky.addColorStop(0.7, "#c4dcea");
  sky.addColorStop(1, "#eef2e4");
  pen.fillStyle = sky;
  pen.fillRect(0, 0, WIDE, 1080);
  natCloud(at, 360, 300, 320, 31, 0.9);
  natCloud(at, 980, 220, 420, 37, 0.85);
  natCloud(at, 1600, 330, 260, 41, 0.8);
  thkLayers(at, layers, {x: 0, z: 0, y: 0}, "#eef2e4");
  thkLight(at, 0.3, 21);
  thkVignette(0.22);
}
var SCENES = [[0, DURATION, scene]];
function draw(t) { film(t, SCENES); }
var rendering = false;
function play(now) { if (!rendering) { draw((now / 1000) % DURATION); } requestAnimationFrame(play); }
requestAnimationFrame(play);
</script>
</body>
</html>
