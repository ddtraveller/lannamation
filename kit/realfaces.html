<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>realfaces - the faces with more realism, beside the painted ones</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
window.FILM_STYLE = {hop: false, wide: 1920};        // they stand still, so the faces can be looked at
</script>
<script src="oldcartoon.js"></script>
<script>
// The "realfaces" sheet: the faces as the thangka and the photographs have them (STYLE.lids and STYLE.face "real",
// the kit's own since 2026-10-29; docs/kit/figures.md, "Faces with more realism"). 0 to 4 s: six of the cast,
// the painted face (STYLE "folded" and "painted", the kit's before) above the real one. 4 to 8 s: three of them
// turning from profile to full face. 8 to 12 s: a lady's feelings and mouths; 12 to 16 s: a fellow's.
var DURATION = 16;
var BEAT = 0.5;
var SIX = [["buakham", 2.2], ["inta", 2.1], ["sinuan", 2.2], ["khammun", 2.1], ["girl", 1.9], ["grandmother", 1.6]];
var TURNS = [-1, -0.6, -0.3, 0, 0.5, 1];
var FEELS = [["calm", {}], ["happy", {feel: "happy"}], ["laughing", {feel: "laughing"}], ["sad", {feel: "sad"}],
             ["angry", {feel: "angry"}], ["concerned", {feel: "concerned"}], ["surprised", {feel: "surprised"}],
             ["sleepy", {feel: "sleepy"}], ["crying", {tears: 0.8, feel: "sad"}], ["ah", {mouth: {open: 0.8, wide: 0.3, round: 0}}],
             ["oo", {mouth: {open: 0.6, wide: 0, round: 1}}], ["a blink", {blink: 0.5}]];

function caption(text, x, y, size) {
  pen.fillStyle = "#5a4630";
  pen.textAlign = "center";
  pen.font = (size || 18) + "px Georgia, 'Leelawadee UI', 'Noto Sans Thai', serif";
  pen.fillText(text, x, y);
}

// One person's head and shoulders in a box, the chin a little above its foot, in the face given ("real" or "painted").
var CHIN = {};
function face(name, more, left, top, wide, tall, size, label, look) {
  STYLE.lids = look === "painted" ? "folded" : "real";
  STYLE.face = look;
  var key = name + size + look;
  if (CHIN[key] === undefined) { CHIN[key] = -person(-9999, 0, cast(name, {size: size, id: "measure-" + key})).chin[1]; }
  pen.save();
  pen.beginPath();
  pen.rect(left + 2, top + 2, wide - 4, tall - 4);
  pen.clip();
  person(left + wide / 2 + 8, top + tall - (tall > 400 ? 110 : 45) + CHIN[key], cast(name, Object.assign({size: size, id: label + name + look,
                                                                                     late: 0, glance: [0, 0], blink: 0}, more)));
  pen.restore();
  STYLE.lids = "real";
  STYLE.face = "real";
  caption(label, left + wide / 2, top + 24, 16);
}

function sheet(t) {
  pen.fillStyle = "#f3ead8";
  pen.fillRect(0, 0, WIDE, 1080);
  if (t < 4) {
    SIX.forEach(function (row, n) {
      face(row[0], {turn: 0.2}, n * 320, 20, 320, 520, row[1], row[0] + ", painted", "painted");
      face(row[0], {turn: 0.2}, n * 320, 550, 320, 520, row[1], row[0] + ", real", "real");
    });
  } else if (t < 8) {
    ["buakham", "inta", "girl"].forEach(function (name, r) {
      TURNS.forEach(function (turn, c) { face(name, {turn: turn}, c * 320, r * 360, 320, 360, name === "girl" ? 1.9 : 2.1, "turn " + turn, "real"); });
    });
  } else {
    var name = t < 12 ? "buakham" : "inta";
    FEELS.forEach(function (f, n) { face(name, Object.assign({turn: 0}, f[1]), (n % 6) * 320, Math.floor(n / 6) * 540, 320, 540, 2.5, f[0], "real"); });
  }
}

function draw(t) {
  settled(t, function (at) {                         // so that a still shows what hangs as the moving sheet has it
    clock = at;
    sheet(at);
  });
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 0, 0);
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
