<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>flora - the flowers and fruits of Thailand</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="oldcartoon.js"></script>
<script src="flora.js"></script>
<script>
// The "flora" sheet, in two parts of six seconds. First the eight flowers
// and the twelve fruits of flora.js, each large, with its Thai name, how
// that is said, and the name flora() takes. Then at their own sizes: an
// orchard of trees in fruit and in flower, a lady on the floor with the
// market's fruit on a mat before her, and the little girl come to see.
var DURATION = 12;

var BEAT = 0.5;

function caption(text, x, y, thai) {
  pen.fillStyle = "#5a4630";
  pen.textAlign = "center";
  pen.font = thai ? "bold 22px 'Leelawadee UI', Tahoma, sans-serif" : "16px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

function sheetNames() {
  pen.fillStyle = "#f3ead8";
  pen.fillRect(0, 0, WIDE, 1080);
  var names = Object.keys(FLORA), flowers = [], fruits = [], n, x, y, name;
  for (n = 0; n < names.length; n++) { (FLORA[names[n]].kind === "flower" ? flowers : fruits).push(names[n]); }
  for (n = 0; n < flowers.length; n++) {
    x = 100 + n * 180;
    y = 250;
    name = flowers[n];
    flora(name, x, y, {size: 1.3});
    caption(FLORA[name].thai, x, y + 40, true);
    caption(FLORA[name].say === name ? name : FLORA[name].say + " · " + name, x, y + 64);
  }
  for (n = 0; n < fruits.length; n++) {
    x = 110 + (n % 7) * 203;                       // seven to a row since the bael made thirteen
    y = 560 + Math.floor(n / 7) * 310;
    name = fruits[n];
    flora(name, x, y, {size: 1.1});
    caption(FLORA[name].thai, x, y + 40, true);
    caption(FLORA[name].say === name ? name : FLORA[name].say + " · " + name, x, y + 64);
  }
}

function sheetOrchard(t) {
  var sky = pen.createLinearGradient(0, 0, 0, 900);
  sky.addColorStop(0, "#8ccfc6");
  sky.addColorStop(1, "#f4ecd2");
  pen.fillStyle = sky;
  pen.fillRect(0, 0, WIDE, 1080);
  pen.fillStyle = "#8fc47a";
  pen.fillRect(0, 880, WIDE, 200);
  floraTree(pen, 230, 900, 1.0, "mango", 1);
  floraTree(pen, 520, 905, 0.9, "papaya", 2);
  floraTree(pen, 860, 900, 0.85, "jackfruit", 3);
  floraTree(pen, 1220, 900, 1.0, "ratchaphruek", 4);
  pen.fillStyle = "#d8c49a";                        // a mat on the ground
  pen.beginPath();
  pen.ellipse(760, 1012, 420, 26, 0, 0, 7);
  pen.fill();
  person(420, 1000, cast("lady", {floor: true, late: 0, spring: 0.3, at: [760, 900], smile: 0.8}));
  flora("pineapple", 560, 1008, {});
  flora("durian", 660, 1012, {});
  flora("coconut", 760, 1006, {});
  flora("mangosteen", 850, 1014, {});
  flora("longan", 930, 1010, {});
  flora("jasmine", 1030, 1008, {size: 0.9});
  person(1140, 1000, cast("girl", {floor: true, face: -1, late: 0.5, spring: 0.3, at: [760, 900], smile: 1}));
  flora("orchid", 1250, 1010, {size: 0.9});
  caption("at their own sizes: trees in fruit and in flower, and the market's fruit on a mat", 720, 1070);
}

function draw(t) {
  settled(t, function (at) {                         // so that a still shows what hangs as the moving sheet has it
    clock = at;
    if (at < 6) { sheetNames(); } else { sheetOrchard(at); }
  });
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 240, 0);
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
