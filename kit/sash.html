<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>
// The film's style, read by the kit as it loads: nobody hops (the dance turns
// it on for its own scene), the old print shows at six tenths, the light comes
// from the upper left and throws a shadow to the right, and the sheet is drawn
// at two device pixels per film pixel and smoothed down to the picture.
window.FILM_STYLE = {wide: 1920, pixels: 2, hop: false, film: 0.6, light: [-0.6, 0.5]};
// The film was staged on the kit's 1440 sheet. On the 1920 one, the sets are
// painted across the whole width with what stands on them moved in by SIDE,
// the old bar's width, and each scene draws its figures under a translation
// by SIDE: every old coordinate keeps its place in the picture.
</script>

<script>
// sash.html - a film of the kit. It opens on a cloth, close up: twelve rows
// of the small things of Thai life, woven across it. Music begins, and the
// things on the cloth begin to dance. The camera pulls back: the rows were a
// sabai, the shoulder cloth of a Lanna woman, and she stands in a village.
// Then four scenes of the life the cloth showed: the lane, the pond, the
// rice fields in a rain that clears, a night of dancing by a spinning
// lantern. A grandmother's
// voice tells the story in Kam Mueang over the music (WORDS, at the end; the
// voice is the Kam Mueang assistant's since 2026-10-18, before that the Kam
// Mueang Voice extension's, made by sash_narrate.py --voice assistant), and the
// film ends on the dance, with no card (owner, 2026-10-16). It is 82 s since
// the owner's own story (2026-10-17): its last line takes 5.6 s, and the dance
// ran three seconds longer so that it is said before the music's fade.
var DURATION = 85;   // the pond 3 s longer, to let the narrator finish pointing out the elephants (owner, 2026-10-21)
// SLOW: the film played slower by that much, its words on their own clock (owner, 2026-10-19: the hero film in the
// Lanna Tales film, told in Pan's voice, which speaks more slowly than the assistant's: every scene held 15%
// longer, its subtitles recut to her lines). 1 here; a render sets SLOW, LENGTH (DURATION x SLOW) and WORDS
// (render.py --set), and this page as it is, and its video, stay as they are.
var SLOW = 1, LENGTH = DURATION;

var BEAT = 0.5;                         // the same number as in sash_music.py

var MUSIC_AT = 3;                       // the second the music begins and the cloth starts to move (sash_music.py leaves three seconds of silence)

// ---------- the men ----------
// The men of Chiang Mai as the record has them. Holt Hallett (1890): no chignon
// and no head-cloth, the hair shaved at the sides with a brush at the crown,
// "tattooed from the waist downwards". Lillian Curtis (1903): the pa toi, plain
// or plaid, "should fall to the knee", a scarf over the shoulders in the cool
// season, "the feet are always bare, and the head uncovered". Manop Manasaem
// (Fine Arts Journal 1:1): shirts only from the reign of Rama V on, round-necked,
// open down the front and tied or buttoned, undyed cotton or indigo; the pha ta
// kong in black and white checks; a pha khao ma at the waist or over the shoulder.
// Since 2026-10-14 the kit's men are drawn from the owner's reference picture
// (a Chiang Mai costume studio's revival of the old dress): the hair in a knot
// on top under a red head-cloth, the chest bare and tattooed, a checked cloth
// over the shoulder, a brown cloth hitched high over tattooed thighs. The film
// takes them as the kit draws them.
var LANNA_MAN = {};

// ---------- the woman and her cloth ----------
// The cloth is the kit's woven sabai (sabai.js): its twelve rows, with the
// woman herself woven into one row of her own, in the same look. The film opens
// on that row.
var WOMAN = cast("lady", {size: 1.45, shirt: "#f2ead8", legs: "#2f3f6e", sin: 0, sabai: false, weave: 1,   // no band of the kit's own: the woven cloth of sabai.js is her sabai
                          flower: "#f28fa8", pins: true, smile: 1, id: "woman", at: [720 + SIDE, 380]});

var WOMAN_ROW = 4;

var ROWS = SABAI_ROWS.slice();
ROWS[WOMAN_ROW] = SABAI_ROWS[WOMAN_ROW].slice(0, 3).concat([function (b, u) { person(0, 0, Object.assign({}, WOMAN, {size: 1.1, step: u, id: "woman-woven", at: undefined})); }]);
// Every figure on the cloth its own (owner, 2026-10-20: "make sure each sprite on the sash is unique"): each row is
// filled to the 24 figures it holds with the kit's pool (sabaiUnique), none twice. The rooster of row 1 and the maiden
// of row 8 are the woman's row's rooster and row 2's maiden again, so they go; "shown" is what the rows weave already.
ROWS[1] = ROWS[1].filter(function (painter, k) { return k !== 3; });
ROWS[8] = ROWS[8].filter(function (painter, k) { return k !== 3; });
// and no item twice in another colour (owner, 2026-10-20: "There are lanterns of differnt colors but I'd like totally
// unique items"): row 2's second lotus, row 5's blue lantern, row 7's green one, row 8's yak (row 7's, facing the
// other way) and its five-headed naga (its three-headed one is the naga) go
ROWS[2] = ROWS[2].filter(function (painter, k) { return k !== 2; });
ROWS[5] = ROWS[5].filter(function (painter, k) { return k !== 2; });
ROWS[7] = ROWS[7].filter(function (painter, k) { return k !== 2; });
ROWS[8] = ROWS[8].filter(function (painter, k) { return k !== 1 && k !== 2; });
// The tale's own people, as the tale draws them (maeng/sets.js: MAENG_KING, MAENG_GROOM, MAENG_SIMA), woven in the rows
// the film opens on (owner, 2026-10-20: "add the king and princess of the story and the hero of the story just after
// marriage"): King Phanthumati in his silk head-cloth, and Thukkhata with Princess Sima, just married, side by side.
var SASH_KING = {turban: null, wrap: "#6a2a5a", sarong: ["#5a2a6a", BROCADE], size: 1.1, age: 0.45, beard: "#2a2220", smile: 0.6};
var SASH_GROOM = {turban: "#e8d8a0", sarong: ["#2a6a5a", BROCADE], size: 1.1, smile: 0.8};
var SASH_SIMA = {skirt: false, sin: 0, sabai: ["#e0b23a", "#8a2a3a"], bun: "ipun", pins: true, flower: "#f2cf5a", dance: false,
                 bangles: 5, earplug: "#e0b23a", size: 1.05, smile: 0.9};
ROWS[3] = ROWS[3].concat([function (b, u) { person(0, 0, cast("noble", Object.assign({step: u, id: "woven-king"}, SASH_KING))); }]);
ROWS[5] = ROWS[5].concat([function (b, u) {
  person(-45, 0, cast("noble", Object.assign({step: u, id: "woven-groom"}, SASH_GROOM)));
  person(45, 0, cast("lady", Object.assign({step: u, id: "woven-sima"}, SASH_SIMA)));
}]);
var SHOWN = ["villager walk", "child walk", "maiden walk", "fellow walk", "weaver walk", "celestial walk", "drummer walk",
             "lady sit", "child sit", "rooster", "sunbird", "buffalo", "elephant", "peafowl", "mom", "luang", "naga",
             "yak", "hong", "lotus", "lotus leaf", "longan", "orchid", "thongkwao", "house", "granary", "oxcart", "namton", "temple", "tung",
             "chedi sai", "krathong", "khom", "khom dao", "sueng", "pig"];
ROWS = sabaiUnique(ROWS, 24, SHOWN, [WOMAN_ROW, 8]);   // dealt outward from where the film opens, her figure (WOMAN_AT, below)
// Her own woven figure at slot WOMAN_AT of her row: the row flows toward the cloth's cut end as the music plays, and from
// there she does not reach it before the camera has pulled back (from slot 3, where she was, she would have walked off
// that end at 12.6 s and come on again at the other, the camera jumping with her).
var WOMAN_AT = 8;
ROWS[WOMAN_ROW].splice(WOMAN_AT, 0, ROWS[WOMAN_ROW].splice(3, 1)[0]);
// Two places to her right the oil lamp (pratheep), a flame on its dish, read as a campfire at the size it is woven: a
// naga there instead (owner, 2026-10-21: "replace the camp fire icon in the sash with the naga"); then the tattooed man
// beside it (pu man) flickered red rectangles as the camera pulled back, so a temple and a yak giant in their places
// (owner, 2026-10-21: "Try swapping them for a temple and a yak giant").
ROWS[WOMAN_ROW] = ROWS[WOMAN_ROW].map(function (painter) {
  if (painter.key === "pratheep") { return function (b) { temple(b, 0, 0); }; }
  if (painter.key === "pu man") { return function (b) { yak(b, 0, 0, 1); }; }
  return painter;
});

// The rows flow and the figures walk when the music begins; the rows the film opens on are woven fine, the rest at half.
// The camera opens on her own woven figure (ROWS[WOMAN_ROW][WOMAN_AT]) and keeps it in the middle as the row moves, until it
// pulls back to her standing there wearing the cloth (owner, 2026-10-20: "Make sure the central sprite that starts out
// being focused on is the same one that is the woman standing there wearing the sash when the video pulls out").
var CLOTH = {rows: ROWS, from: MUSIC_AT, row: WOMAN_ROW, fine: 1, follow: WOMAN_AT};

// ---------- the sets ----------
// The sky of a scene, painted once: day, dusk or night, with the stars at
// night. The clouds are not on it: cumulus.js drifts them over it, under the
// land, in every frame.
function paintSky(kind) {
  var paper = document.createElement("canvas");
  paper.width = WIDE;
  paper.height = 1080;
  var brush = paper.getContext("2d"), n;
  var sky = brush.createLinearGradient(0, 0, 0, 1080);
  if (kind === "night") {
    sky.addColorStop(0, "#070b24"); sky.addColorStop(0.6, "#1b2350"); sky.addColorStop(1, "#40336b");
  } else if (kind === "dusk") {
    sky.addColorStop(0, "#f0642a"); sky.addColorStop(0.5, "#f2a23c"); sky.addColorStop(1, "#7fb89a");
  } else {
    sky.addColorStop(0, "#8ccfc6"); sky.addColorStop(0.6, "#f4ecd2"); sky.addColorStop(1, "#f1d3bd");
  }
  brush.fillStyle = sky;
  brush.fillRect(0, 0, WIDE, 1080);
  if (kind === "night") {
    for (n = 0; n < 70; n++) {
      brush.fillStyle = "rgba(255, 250, 220, " + (0.4 + 0.6 * dice(n + 70)) + ")";
      brush.beginPath();
      brush.arc(dice(n) * WIDE, dice(n + 90) * 620, 1.5 + dice(n + 20) * 1.5, 0, 7);
      brush.fill();
    }
  }
  return paper;
}

// The land of a set, on two clear sheets: "back", the far and the middle ranges
// under the air between them, and "front", the near range, the ground and what
// stands on it. A scene lays the back, then what is between them (the mist, the
// pond's elephants), then the front. Every range is clothed in forest, fainter
// the further it is, and by day the middle one has a patch of rice terraces cut
// into it where it stands highest in the part of the picture its set leaves
// open, from highlands.js (owner, 2026-10-17: "decorate all the mountains like
// that", of the rice fields' mountains).
var TERRACES_AT = {village: [420, 880], pond: [380, 1000]};   // where a set's own trees, house, banana and grove leave the middle range open

function paintSet(kind) {
  function sheet() {
    var paper = document.createElement("canvas");
    paper.width = WIDE;
    paper.height = 1080;
    return paper;
  }
  function line(tops) { return function (x) { return tops[Math.max(0, Math.min(WIDE - 1, Math.round(x)))]; }; }
  var back = sheet(), front = sheet(), brush = back.getContext("2d"), n;
  var far = kind === "night" ? ["#223a4a", "#1a2e3c", "#142430", "#2a4a3a"] : kind === "dusk" ? ["#7a8a9a", "#5f7a6a", "#4f6a52", "#6f8a4a"] : ["#a9cfc9", "#8dbfa9", "#79ad84", "#8fc47a"];
  function wooded(b, tops, foot, look) {           // a range's forest; at night only its shape, laid faint on the dark hill, for its crowns are lit by day
    if (kind !== "night") { forestSlope(b, line(tops), 0, WIDE, foot, look); return; }
    var shade = sheet();
    forestSlope(shade.getContext("2d"), line(tops), 0, WIDE, foot, look);
    b.globalAlpha = 0.3;
    b.drawImage(shade, 0, 0);
    b.globalAlpha = 1;
  }
  hills(brush, WIDE, 720, 400, 1.0, far[0]);
  wooded(brush, withoutTufts(ridgeOf(720, 400, 1.0)), 800, {far: 0.8, small: 3, large: 6, haze: far[0], seed: 21});
  hills(brush, WIDE, 790, 280, 2.6, far[1]);
  wooded(brush, GROUND, 870, {far: 0.5, small: 4, large: 9, haze: far[1], seed: 22});
  if (TERRACES_AT[kind]) {
    var top = Infinity, at = 0, x;
    for (x = TERRACES_AT[kind][0] + SIDE; x < TERRACES_AT[kind][1] + SIDE; x++) { if (GROUND[x] < top) { top = GROUND[x]; at = x; } }
    terraces(brush, at, top + 24, 360, Math.min(170, 790 - top), {season: "green", hut: true, seed: kind === "pond" ? 6 : 5, count: 7});
  }
  if (kind === "dusk") {                           // trees on the middle range, where its ridge is
    [[130, 0.3], [215, 0.26], [600, 0.3], [690, 0.27], [1250, 0.3], [1440, 0.28]].forEach(function (one) {
      tree(brush, one[0] + SIDE, ridgeAt(one[0] + SIDE) + 6, one[1]);
    });
  }
  // The air between: a veil of the sky's colour over the far ranges, thick at
  // the horizon and gone by the near range, so the far hills sit further off.
  // It comes in over its first 40 rows: begun whole at y 640, it drew a ruled
  // line across the forest on the slopes (row 639 to 640 changed six times as
  // much as any other row of the set).
  var haze = brush.createLinearGradient(0, 640, 0, 880);
  var veil = kind === "night" ? "20, 30, 60" : kind === "dusk" ? "245, 190, 120" : "226, 238, 240";
  haze.addColorStop(0, "rgba(" + veil + ", 0)");
  haze.addColorStop(1 / 6, "rgba(" + veil + ", 0.42)");
  haze.addColorStop(1, "rgba(" + veil + ", 0)");
  brush.fillStyle = haze;
  brush.fillRect(0, 640, WIDE, 240);
  brush = front.getContext("2d");
  hills(brush, WIDE, 860, 170, 4.4, far[2]);
  wooded(brush, withoutTufts(ridgeOf(860, 170, 4.4)), 885, {far: 0.25, small: 6, large: 12, haze: far[2], seed: 23});
  brush.fillStyle = far[3];
  brush.fillRect(0, 880, WIDE, 200);
  // What grows in each place (owner, 2026-10-17: "Also add plants and flowers that are special to the
  // different scenes as appropriate", from flora.js); a flower is drawn on "pen", so the pen is this sheet
  // for the length of it.
  var keep = pen;
  pen = brush;
  if (kind === "village" || kind === "day") {
    floraTree(brush, 200 + SIDE, 900, 1.1, "longan", 7);   // a longan in fruit, the fruit of Lamphun and Chiang Mai, where a plain tree stood
    house(brush, 1180 + SIDE, 905, 1);
    banana(brush, 1000 + SIDE, 915);
    namton(brush, 1425 + SIDE, 912, 1.1);          // the water jar at the gate, beside the house's ladder (pieces.js)
    flora("marigold", 1080 + SIDE, 922, {size: 0.9});   // marigolds for the offerings at the house's foot, jasmine for the garlands by the jar
    flora("marigold", 1128 + SIDE, 928, {size: 0.75});
    flora("jasmine", 1490 + SIDE, 924, {size: 0.9});
    floraTree(brush, 1830 + SIDE, 905, 0.75, "bougainvillea", 8);   // and a bougainvillea at the edge of the yard
  }
  if (kind === "night") {                          // a frangipani, the temple's tree, its white flowers pale in the lantern light
    floraTree(brush, 1790 + SIDE, 885, 0.95, "frangipani", 9);
  }
  pen = keep;
  if (kind === "pond") {                            // the water, the lotus and the fish are drawn live, in scenePond
    // Special trees of the north (owner, 2026-10-17: "Change cats to some special plant the Lanna did
    // have and add it to the scene", then "Add some other special plants or animals as well"): on the
    // left bank, where a plain tree stood, a ratchaphruek in flower, the golden shower, the national tree;
    // on the right bank a thong kwao, the flame of the forest, Chiang Mai's own tree, which the voice
    // names (flora.js); wild orchids on both trunks (scenePond).
    floraTree(brush, 160 + SIDE, 880, 1.0, "ratchaphruek", 3);
    floraTree(brush, 1540 + SIDE, 884, 0.95, "thongkwao", 5);
  }
  return {back: back, front: front};
}

// The mist between the ranges, laid between a set's back and its front: bands
// along the middle range's slopes, and wider ones in patches at its foot (the
// rice fields' scene has its own). T is the film's clock, so the mist drifts on
// across a cut between two scenes of one set. At night it is moonlit, and faint.
function hillMist(T, night) {
  var look = night ? {colour: "#c4cee4", shade: "#4a5a7a"} : {};
  mistDrift(pen, T, Object.assign({left: 0, right: WIDE, top: 560, bottom: 700, count: 6, drift: 8, seed: 31, alpha: night ? 0.3 : 0.6}, look));
  mistDrift(pen, T, Object.assign({left: 0, right: WIDE, top: 768, bottom: 800, count: 5, wide: 560, drift: 5, seed: 32, alpha: night ? 0.25 : 0.55}, look));
}

// The front of the dusk set on a clear sheet: the temple, the yak and the tung.
// The elephant on the hill is drawn between this and the dusk sheet, so it walks behind them.
function paintTempleFront() {
  var paper = document.createElement("canvas");
  paper.width = WIDE;
  paper.height = 1080;
  var brush = paper.getContext("2d");
  temple(brush, 1050 + SIDE, 905);
  yak(brush, 760 + SIDE, 910, -1);
  tung(brush, 300 + SIDE, 900, 0);
  tung(brush, 420 + SIDE, 900, 0);
  return paper;
}

// The ridge of a range of hills, column by column: the range is painted alone
// on a scratch sheet, as hills(brush, WIDE, base, tall, shape) paints it, and
// the first painted pixel of each column is the ridge.
function ridgeOf(base, tall, shape) {
  var paper = document.createElement("canvas");
  paper.width = WIDE;
  paper.height = 1080;
  var brush = paper.getContext("2d");
  hills(brush, WIDE, base, tall, shape, "#000000");
  var data = brush.getImageData(0, 0, WIDE, 1080).data, tops = [];
  for (var x = 0; x < WIDE; x++) {
    var y = 0;
    while (y < 1080 && data[(y * WIDE + x) * 4 + 3] < 60) { y++; }
    tops.push(y);
  }
  return tops;
}

// The middle range's ridge: trees and the elephant stand on it.
var RIDGE = ridgeOf(790, 280, 2.6);

function ridgeAt(x) { return RIDGE[Math.max(0, Math.min(WIDE - 1, Math.round(x)))]; }

// The ridge with its tufts of grass taken off, for what walks along it. A tuft
// stands up to 13 pixels above the ridge and is at most 15 wide, so each column
// is first lowered to the lowest of the ridge within 9 columns each side, and
// then raised to the highest of that within 9 columns each side (a closing):
// what is narrower than 19 columns goes, and a straight or gently curved ridge
// comes back as it was.
function withoutTufts(tops) {
  function pass(from, pick) {
    return from.map(function (y, x) {
      for (var d = -9; d <= 9; d++) { y = pick(y, from[Math.max(0, Math.min(from.length - 1, x + d))]); }
      return y;
    });
  }
  return pass(pass(tops, Math.max), Math.min);
}

var GROUND = withoutTufts(RIDGE);

function groundAt(x) { return GROUND[Math.max(0, Math.min(WIDE - 1, Math.round(x)))]; }

// A Siamese cat sitting, facing right: cream coat, seal-brown points on the face,
// the ears, the legs and the tail, blue eyes. "t" sways the tail and blinks.
function siamese(x, base, size, t) {
  var CREAM = "#efe2c8", POINT = "#4a3028", sway = Math.sin(t * 1.3) * 0.25;
  var blink = (t % 4) > 3.7 ? 0.15 : 1;
  pen.save();
  pen.translate(x, base);
  pen.scale(size, size);
  hose(-30, -42, -74, -112, 0.45 + sway, 13, POINT);            // the tail, curling up behind
  oval(-16, -46, 36, 40, CREAM);                                // the haunch
  hose(6, -56, 4, -6, 0, 15, POINT);                            // the front legs, dark to the paws
  hose(26, -56, 26, -6, 0, 15, POINT);
  oval(12, -78, 30, 46, CREAM);                                 // the chest
  oval(28, -124, 30, 27, CREAM);                                // the head
  pen.fillStyle = POINT;                                        // the ears
  pen.strokeStyle = INK;
  pen.lineWidth = 2;
  pen.lineJoin = "round";
  [[8, -142, 12, -172, 28, -146], [38, -146, 52, -172, 56, -140]].forEach(function (e) {
    pen.beginPath();
    pen.moveTo(e[0], e[1]);
    pen.lineTo(e[2], e[3]);
    pen.lineTo(e[4], e[5]);
    pen.closePath();
    pen.fill();
    pen.stroke();
  });
  oval(36, -118, 21, 16, POINT);                                // the mask
  oval(30, -121, 5, 6 * blink, "#6fb7e6");                      // blue eyes
  oval(46, -120, 5, 6 * blink, "#6fb7e6");
  pen.fillStyle = INK;
  pen.beginPath();
  pen.ellipse(31, -121, 1.6, 5 * blink, 0, 0, 7);
  pen.ellipse(47, -120, 1.6, 5 * blink, 0, 0, 7);
  pen.fill();
  pen.fillStyle = "#d98a90";                                    // the nose
  pen.beginPath();
  pen.moveTo(52, -112);
  pen.lineTo(58, -112);
  pen.lineTo(55, -108);
  pen.closePath();
  pen.fill();
  pen.strokeStyle = "rgba(60, 40, 30, 0.6)";                    // whiskers
  pen.lineWidth = 1.2;
  pen.beginPath();
  pen.moveTo(56, -110); pen.lineTo(78, -116);
  pen.moveTo(56, -108); pen.lineTo(78, -104);
  pen.moveTo(16, -112); pen.lineTo(-4, -118);
  pen.moveTo(16, -110); pen.lineTo(-4, -106);
  pen.stroke();
  pen.restore();
}

var SKY_DAY = paintSky("day"), SKY_DUSK = paintSky("dusk"), SKY_NIGHT = paintSky("night");
var VILLAGE = paintSet("village"), POND = paintSet("pond"), TEMPLE = paintSet("dusk"), TEMPLE_FRONT = paintTempleFront(), NIGHT = paintSet("night");

// A scene's sky: its sheet, then the cumulus drifting by the film's clock T,
// so that the same clouds cross the sky from one scene to the next.
function skyOf(sheet, look, T) {
  pen.drawImage(sheet, 0, 0);
  cumulus(pen, T, look);
}

// The tung by the house is drawn live, not on the village set, so that its
// cloth sways in the breeze from the top of the pole, the kit's tung() given
// the film's clock. The pole and the hong on it stand still (owner,
// 2026-10-16: "the one with the yellow rooster at the top has a swaying stick
// but the flag doesn't sway. I'd prefer the stick not to sway or barely at
// all"; it had leaned the whole tung about its foot).
function villageTung(T) {               // T: the film's clock, so the sway goes on across the cut
  tung(pen, 1570 + SIDE, 905, T, true);
}

// The birds of the north (owner, 2026-10-17: "Add some birds to the hero

// The rooster and the hen in the lane (owner, 2026-10-17: "have the chicken
// run a few steps and then jump into the air flapping its wings but then come
// down and scurry off until it is off screen. The dog should increase speed as
// soon as the chicken starts to run"; "When the chicken jumps have a small
// feather fall and descend to the ground and fade away"; "Add a second chicken
// a little to the right of the first that startles and scurries off screen").
// The rooster crows, then pecks about the lane (roosterForage); the hen, a
// little to its right and a step farther back, pecks all along. When the dog
// comes near, the rooster takes fright (FRIGHT) and bolts (the kit's
// roosterBolt(): a start, a few running steps, a hop with its wings beating,
// and away), and a feather comes loose at the top of its hop and drifts down;
// the hen takes fright a moment after it and runs straight off. The dog, from
// the second the rooster starts to run, goes from its trot to a run more than
// twice as fast, its legs quicker with it, and follows them out of the picture.
// The rooster stood at 1060, under the words; it stands at 1300 now, so the
// fright is not behind them.
var FRIGHT = 6.2;                        // the second of the lane scene the rooster takes fright: the dog's nose is 250 from its tail
var CROWED = 3;                          // when the rooster stops crowing and starts to peck (at the end of a crow)
var COOP = [{x: 1300, y: 1000, late: 0, seed: 1}, {x: 1490, y: 988, late: 0.08, seed: 2, hen: true}];

function chicken(t, c) {                 // one of COOP at second t of the lane scene: pecking, then off
  var fright = FRIGHT + c.late, idle = c.hen ? {hen: true} : {};
  function peckAt(T) { return roosterForage(T, c.seed) * (c.hen ? 1 : between(T, CROWED, CROWED + 0.3)); }
  if (t < fright) {
    if (c.hen || t >= CROWED) { idle.peck = peckAt(t); }
    rooster(c.x, c.y, t, idle);
    return;
  }
  var off = roosterBolt(t - fright, {hop: !c.hen, hen: c.hen, peck: peckAt(fright)});
  if (c.x + off.x < WIDE + 80) { rooster(c.x + off.x, c.y + off.y, t, off.look); }
}

function looseFeather(t) {               // the feather the rooster loses at the top of its hop
  var c = COOP[0], top = roosterBolt(BOLT.top);
  fallingFeather(c.x + top.x - 8, c.y + top.y - 40, c.y + 6, t - FRIGHT - BOLT.top, 3, ROOSTER_COAT.body, 40);
}

function chase(t) {                      // how far past its steady trot the dog has gone, in seconds of trot: it runs 420 a second once the rooster runs, not 195
  var s = t - FRIGHT - BOLT.run;
  if (s <= 0) { return 0; }
  var u = Math.min(1, s / 0.5);
  return (225 / 195) * (s < 0.5 ? 0.5 * (u * u * u - u * u * u * u / 2) : 0.25 + (s - 0.5));   // the speed eases up over half a second
}

function sceneLane(t) {                 // 22-35: the lane: a man and a child come one way, a woman the other

  // Each walks with stroll(): a step a beat, the foot on the ground planted, a

  var kid = stroll(t, -200, 300, 1, cast("child", Object.assign({stride: 0.9, late: 0.5, spring: 0.7, smile: 1, at: [820, 700], wai: t >= 7.2,
                                                   wonder: tween(t, [[6, 0.3], [6.5, 1], [7.4, 1], [8, 0.4]], "smooth")}, FACE(2))));   // her wai takes him

// The dragon's course through the pond scene (35 to 50), in the film's time:

var DRAGON_COURSE = [[38, -700, 330, 0.05], [43.5, 250, 260, 0.3], [47.3, 900, 340, 0.6], [52.3, 2200, 230, 0.9],   // a touch slower than it was (owner, 2026-10-15)

// The dragon's joke (owner, 2026-10-16: "Have a people's republic of China flag
// appear in the dragon's claw for a moment and wave back and forth a few times
// and then disappear"): the flag of the People's Republic of China on a short
// pole in its near front claw (dragon() gives back where that claw is), from
// FLAG[0] to FLAG[1] of the pond scene, while the two at the pond look up. It
// grows out of the claw, the pole rocks back and forth three times as the cloth
// ripples, and it shrinks away. The flag as its law draws it: 3 by 2, red, one
// large gold star and four small ones in an arc toward the fly, each small one
// pointing a tip at the large one's centre (on a grid of 30 by 20: the large
// star at (5, 5), radius 3; the small at (10, 2), (12, 4), (12, 7), (10, 9),
// radius 1).
var FLAG = [8.8, 11.6];
var FLAG_LEAN = 0.4;                    // how far the pole leans forward from upright: more and the flag reads as falling

function flagStar(cx, cy, r, toward) {   // a five-pointed star with one tip toward the angle "toward"
  pen.beginPath();
  for (var k = 0; k < 10; k++) {
    var a = toward + k * Math.PI / 5, d = k % 2 ? r * 0.382 : r;
    if (k) { pen.lineTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d); } else { pen.moveTo(cx + Math.cos(a) * d, cy + Math.sin(a) * d); }
  }
  pen.closePath();
  pen.fill();
}

function chinaFlag(x, y, size, t) {     // the flag in the claw at (x, y), at second t of the pond scene
  var u = (t - FLAG[0]) / (FLAG[1] - FLAG[0]);
  if (u <= 0 || u >= 1) { return; }
  var grow = smooth(Math.min(u, 1 - u) / 0.1);                 // it pops out of the claw, and back into it
  var sway = Math.sin(u * Math.PI * 6) * 0.35;                  // three times back and forth
  var g = 3, W = 30 * g, H = 20 * g, top = -190;               // the cloth, 90 by 60, from the pole's top, high enough to fly above the head
  function ripple(fx) { return 6 * Math.sin(fx / W * Math.PI * 2.4 - t * 9) * (fx / W); }   // still at the pole, most at the fly
  pen.save();
  pen.translate(x, y);
  pen.scale(size * 2.6 * grow, size * 2.6 * grow);
  pen.rotate(FLAG_LEAN + sway);
  pen.lineCap = "round";
  pen.strokeStyle = "#5a3b22";                                  // the pole, gripped by the claw
  pen.lineWidth = 6;
  pen.beginPath();
  pen.moveTo(0, 18);
  pen.lineTo(0, top);
  pen.stroke();
  pen.fillStyle = STYLE.gold;                                   // its knob
  pen.beginPath();
  pen.arc(0, top - 4, 5, 0, Math.PI * 2);
  pen.fill();
  pen.beginPath();                                              // the cloth: the top edge out, the bottom edge back
  for (var n = 0; n <= 24; n++) { var fx = W * n / 24; pen.lineTo(fx, top + ripple(fx)); }
  for (n = 24; n >= 0; n--) { fx = W * n / 24; pen.lineTo(fx, top + H + ripple(fx)); }
  pen.closePath();
  pen.fillStyle = "#de2910";
  pen.fill();
  pen.strokeStyle = inkFor("#de2910");
  pen.lineWidth = 2;
  pen.stroke();
  pen.fillStyle = "#ffde00";
  flagStar(5 * g, top + 5 * g + ripple(5 * g), 3 * g, -Math.PI / 2);
  [[10, 2], [12, 4], [12, 7], [10, 9]].forEach(function (s) {
    var cx = s[0] * g, cy = top + s[1] * g + ripple(s[0] * g);
    flagStar(cx, cy, g, Math.atan2(top + 5 * g + ripple(5 * g) - cy, 5 * g - cx));
  });
  pen.restore();
}

// Drops on the pond, in the scene's seconds: a fish rising, twice, and a drop from a leaf.
var POND_RINGS = [[760, 905, 2.0], [1000, 960, 5.5], [640, 985, 7.8]];

// Far off on the middle range, behind a grove of banana trees, an elephant and
// her calf amble along the ridge, right to left, the calf a little behind. They
// are drawn on the set's own ridge (ridgeAt) and the grove over them, so they
// show between its stems and leaves; all of it is drawn on a sheet of its own
// and veiled there with the set's haze, over the figures alone, so they sit as
// far off as the hills they walk on and the veil has no edge.
var POND_GROVE = [[1040, 0.42], [1110, 0.5], [1190, 0.46], [1270, 0.4]];   // each banana tree: x on the old sheet, its scale
var FAR = document.createElement("canvas");
FAR.width = WIDE;
FAR.height = 1080;
var FAR_PEN = FAR.getContext("2d");

// The line of the hill under a beast at x facing "face": a straight line fitted
// to the ground (the ridge without its tufts, GROUND) under its length (half to
// each side). It gives where the beast stands, y, and how far the hill falls
// away ahead of it, slope (radians, as the beasts' "slope" takes it). Owner,
// 2026-10-17: the elephant walking down the hill had its front feet in the air
// (the kit's elephant pitches with a slope, and the film gave it none); then,
// "it pops up into the air a couple of times while walking down the hill. It
// should maintain course along a line": it stood on the ridge's first painted
// pixel, which a tuft lifts by up to 13 pixels.
function ridgeLine(x, face, half) {
  var n = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (var dx = -half; dx <= half; dx += 2) {
    var at = Math.round(x + dx) - x, y = groundAt(x + dx);   // each at its own column, so the fit does not jump as x passes a half pixel
    n++; sx += at; sy += y; sxx += at * at; sxy += at * y;
  }
  var b = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  return {y: (sy - b * sx) / n, slope: Math.atan(face * b)};
}

function pondElephants(t) {

  var calf = amble("elephant", t, 1290 + SIDE, 1110 + SIDE, 0.7, {size: 0.04, late: 0.3, tusks: false});

  elephant(cow.x, cowOn.y + 11, Object.assign({}, cow.look, {slope: cowOn.slope}));   // on the hill's line, pitched with it, a little sunk into the leaves
  elephant(calf.x, calfOn.y + 9, Object.assign({}, calf.look, {slope: calfOn.slope}));
  for (var leafX = 940 + SIDE; leafX < 1480 + SIDE; leafX += 7) {   // the forest's edge before them: leaves over their legs
    var ly = ridgeAt(leafX) + 6, r = 6 + 4 * dice(leafX);

  pen.drawImage(FAR, 0, 0);
}

// The two at the pond, as the dragon goes by (owner, 2026-10-18: "the man should look surprised when the
// dragon appears and then angry when it shows a Chinese flag for a moment and then go back to being happy.
// The woman should laugh when the flag comes out and put her hands in her lap"). Seconds of the scene: the
// dragon's head comes into the picture at 7.2 (DRAGON_COURSE), the flag is out from FLAG[0] to FLAG[1].
var POND_SEEN = 7.4;                    // he sees it, a beat after it comes in
var POND_FLAG = FLAG[0] + 0.2;          // the flag is out of the claw: he is angry, she laughs and puts her hands in her lap
var POND_CALM = FLAG[1] + 0.3;          // it is gone: he is glad again
var POND_LAUGHED = FLAG[1] + 0.6;       // and her laugh dies away a moment after
// Her hands in her lap are the kit's own for one who sits (person(), "Hands that a scene does not place"):
// turned in toward each other, the far arm (A, her left, the cloth's shoulder) under the sabai with only its
// hand showing, and nothing crossed (owner, 2026-10-18: "the woman crosses her arms but she should look like
// she is sitting naturally and her left arm should be below the sash").

// Reeds at the pond's edge, a clump of sedge, their blades swaying; "back" the ones behind what stands in them,
// "front" the ones before it.
function pondReeds(x, base, size, t, part) {
  pen.save();
  pen.translate(x, base);
  pen.scale(size, size);
  pen.lineCap = "round";
  for (var n = 0; n < 14; n++) {
    var front = n % 2 === 1;
    if ((part === "front") !== front) { continue; }
    var at = (n - 7) * 11 + 6 * Math.sin(n * 2.1), tall = 130 + 70 * dice(n + 3), lean = 0.18 * Math.sin(n * 1.3) + 0.04 * Math.sin(t * 1.4 + n);
    pen.strokeStyle = front ? "#5f8a34" : "#3f6a24";
    pen.lineWidth = 4;
    pen.beginPath();
    pen.moveTo(at, 0);
    pen.quadraticCurveTo(at + lean * tall * 0.3, -tall * 0.6, at + lean * tall, -tall);
    pen.stroke();
    if (n % 4 === 0) {                              // a seed head here and there
      pen.fillStyle = "#8a6a3a";
      pen.beginPath(); pen.ellipse(at + lean * tall, -tall - 4, 3, 8, lean, 0, 7); pen.fill();
    }
  }
  pen.restore();
}

function scenePond(t) {                 // 35-53 (3 s longer since 2026-10-21, the elephants pointed out): the pond: lotus, fish, a maiden at the bank who wais; a Chinese dragon flies by with a flag; elephants far off

// 50-70: the rice fields in a rain storm that clears. Three women walk in
// under their parasols (the Thai borders, the yantra, the elephants round the
// Buddha), dark cumulus over the hills and rain slanting down, one flash of
// lightning; the clouds thin and blow away and the sun comes out; the women
// stop, tip their parasols to the viewer and spin them, the rain flying off
// the rims; close them, snap them open to shake the rain off, close them and
// swing them to their sides; and walk on, until the first of them has left
// the frame. The same scene, on its own, is parasol_rain.html.
var PADDY_WOMEN = [
  {name: "lady", kind: "lai", from: 60, to: 400, start: 0, late: 0, hair: {bun: "ipun", malai: true}},
  {name: "maiden", kind: "yantra", from: 360, to: 720, start: 0.3, late: 0.3, hair: {bun: "wong", turban: "#f2b8c6"}},   // a Tai Lue maiden: her knot on the crown, a pink head-cloth
  {name: "weaver", kind: "buddha", from: 680, to: 1040, start: 0.6, late: 0.6, hair: HAIR_OF.weaver}
];
var PADDY_TWIRL = 3.2;                  // the spin begins, each woman a little after the one before
var PADDY_FOLD = 8.8;                   // tipped down still: close, snap open, close, and swing the parasol to the side (5.6 s)
var PADDY_WALK = 15.0;                  // they walk on, the parasols carried

var STORM_LOOK = {count: 8, lit: "#9aa2b4", shade: "#55607a", below: false, ink: "#2b3142"};
var STORM = document.createElement("canvas");    // the storm clouds are drawn whole here, then laid on at the storm's strength
STORM.width = WIDE;
STORM.height = 1080;
var STORM_PEN = STORM.getContext("2d");

function smooth(u) { u = clamp(u); return u * u * (3 - 2 * u); }

function storm(t) { return 1 - smooth((t - 2.5) / 3); }       // the dark and the clouds, 1 to 0
function rainfall(t) { return 1 - smooth((t - 2.0) / 2.5); }  // the rain, which stops a little before the sky clears

function rain(brush, t, amount, layer) {   // streaks that fall slanting, each on its own course, behind the women (0) and before them (1)
  if (amount <= 0) { return; }
  var n = Math.round(300 * amount), i;
  brush.strokeStyle = layer ? "rgba(230, 238, 250, 0.6)" : "rgba(220, 230, 245, 0.45)";
  brush.lineWidth = layer ? 2 : 1.4;
  brush.lineCap = "round";
  brush.beginPath();
  for (i = 0; i < n; i++) {
    var seed = i * 7 + layer * 3, quick = 900 + 500 * dice(seed + 2);
    var y = (dice(seed) * 1200 + t * quick) % 1200 - 60;
    var x = ((dice(seed + 1) * (WIDE + 300) - t * quick * 0.14) % (WIDE + 300) + (WIDE + 300)) % (WIDE + 300) - 150;
    brush.moveTo(x, y);
    brush.lineTo(x + 4, y - 28);
  }
  brush.stroke();
}

function rainOff(brush, w, t, joints) {    // drops leave the rim: many as it spins, a last few as it snaps open
  // Made plainer (owner, 2026-10-16: "make the rain that spins off more
  // evident"): 150 drops a parasol, not 60, living 0.9 s, thrown faster and a
  // little outward so they leave the rim, each a teardrop with a dark edge and a
  // glint, so they read on a pale parasol, a black one and the sky alike.
  // And when the parasol is closed and snapped open one last time (the "fold"
  // show), a last 24 drops are flung off its rim, outward and a little up, and
  // fall (owner, 2026-10-17: "When they open their parasols have a few last rain
  // drops fly off").
  // The rim is given in the film's own pixels, so the drops are drawn there,
  // PIX to a film pixel (with pixels: 2 they had been drawn twice as far out).
  var d = t - (PADDY_TWIRL + w.late), f = t - (PADDY_FOLD + w.late), i;
  if (!joints.parasol || (d < 1.8 || d > 5.4) && (f < 1.8 || f > 3.1)) { return; }
  var cx = joints.parasol[0], cy = joints.parasol[1], R = Math.hypot(joints.parasolRim[0] - cx, joints.parasolRim[1] - cy);
  var fall = 1400 * PIX;
  brush.save();
  brush.setTransform(1, 0, 0, 1, 0, 0);
  brush.lineCap = "round";
  function drop(x, y, vx, vy, fade, r) {      // a teardrop: a round head, and a tail that thins behind it along its way
    var speed = Math.hypot(vx, vy) || 1, ex = vx / speed, ey = vy / speed, heading = Math.atan2(ey, ex);
    var tail = Math.min(speed * 0.05, 60 * PIX) + r;
    brush.beginPath();
    brush.moveTo(x - ex * tail, y - ey * tail);
    brush.lineTo(x - ey * r, y + ex * r);
    brush.arc(x, y, r, heading + Math.PI / 2, heading - Math.PI / 2, true);
    brush.closePath();
    brush.fillStyle = "rgba(125, 180, 240, " + fade.toFixed(2) + ")";
    brush.fill();
    brush.strokeStyle = "rgba(30, 70, 140, " + (0.85 * fade).toFixed(2) + ")";
    brush.lineWidth = 1.6 * PIX;
    brush.stroke();
    brush.beginPath();                           // a glint in the head
    brush.arc(x - ex * r * 0.2 - ey * r * 0.35, y - ey * r * 0.2 + ex * r * 0.35, r * 0.32, 0, Math.PI * 2);
    brush.fillStyle = "rgba(250, 252, 255, " + fade.toFixed(2) + ")";
    brush.fill();

    var born = 1.8 + dice(i * 3 + 11) * 2.6, age = d - born;
    if (age < 0 || age > 0.9) { continue; }
    var angle = parasolAt(born, 0, undefined, undefined, "spin").spin + i * 0.9, ux = Math.cos(angle), uy = Math.sin(angle);
    var turn = (450 + 300 * dice(i * 3 + 12)) * PIX, out = (60 + 80 * dice(i * 3 + 13)) * PIX;
    drop(cx + ux * R + (-uy * turn + ux * out) * age, cy + uy * R + (ux * turn + uy * out) * age + fall / 2 * age * age,
         -uy * turn + ux * out, ux * turn + uy * out + fall * age,
         1 - age / 0.9, (5 + 3 * dice(i * 3 + 14)) * PIX * (1 - age / 1.6));
  }
  for (i = 0; i < 24 && f >= 1.8 && f <= 3.1; i++) {    // the last snap open: flung straight out from all round the rim, a little up, and down
    var flung = 1.85 + dice(i * 5 + 31) * 0.3, after = f - flung;
    if (after < 0 || after > 0.8) { continue; }
    var round = i * 2.39996 + dice(i * 5 + 32) * 0.5, vx = Math.cos(round), vy = Math.sin(round);   // the golden angle: spread evenly round the rim
    var fling = (260 + 200 * dice(i * 5 + 33)) * PIX, rise = (80 + 120 * dice(i * 5 + 34)) * PIX;
    drop(cx + vx * R + vx * fling * after, cy + vy * R + (vy * fling - rise) * after + fall / 2 * after * after,
         vx * fling, vy * fling - rise + fall * after,
         1 - after / 0.8, (4 + 3 * dice(i * 5 + 35)) * PIX * (1 - after / 1.6));
  }
  brush.restore();
}

}

// ---------- the spinning lantern ----------
// A khom phat (khom.js), the spinning lantern of Yi Peng, hangs at the left of
// the night of dancing, opposite the band, from an arm on the lantern string's
// pole, and three children stand behind the great drum looking up at it (owner,
// 2026-10-16: "Take the spinning lantern and add it to the final scene and
// remove the scene with the close up of the lantern. Just add one and a few
// children looking at it so they are on the left side of the screen", and
// "Opposite the band"). Its figures are of light (khomPhat's "light": a dark
// drum inside, the figures cut out of it), and they are the film's own: the
// woman of the cloth, an elephant, a child and a dancer, a quarter turn apart,
// each cut whole, with no shadow on the ground (ground: false), walking as the
// frame turns.
var PHAT = [145, 360, 1.1];              // where its string is tied, and its size
var PHAT_FIGURE = 0.22;                  // the figures on the paper: the woman about 95 tall at size 1
var phatWalk;                            // how far the figures have walked as the frame turns: set before it is drawn

function phatFigure(draw) {              // one figure of the lantern, at its size on the paper
  return function () { pen.scale(PHAT_FIGURE, PHAT_FIGURE); draw(); };
}

var PHAT_FIGURES = [
  phatFigure(function () { person(0, 0, Object.assign({}, WOMAN, {size: 1, id: "phat-woman", at: undefined, late: undefined, ground: false, step: phatWalk})); }),
  phatFigure(function () { elephant(0, 0, {size: 0.45, ground: false, step: phatWalk}); }),
  phatFigure(function () { person(0, 0, cast("child", {size: 0.85, id: "phat-child", late: undefined, ground: false, step: phatWalk})); }),
  phatFigure(function () { person(0, 0, cast("dancer", {size: 1, id: "phat-dancer", late: undefined, ground: false, handA: [60, -130], handB: [-60, -110]})); })
];

// The boy's wrist on its way down, from pointing at the lantern to beside his

// face and the face of the girl in yellow stand about 55 apart on the sheet
// (x 160 and 215), so the wrist goes up through that gap beside his face, out
// under her chin at the height of his shoulder (150, 787 as person() draws it)
// and down; it is never nearer his shoulder than 42 (the wrist is 68 from it
// with the arm straight), so the elbow keeps its side. Swung round the shoulder
// as the girls' arms are, his hand went over her mouth: she is within an arm of him.
var BOY_DOWN = [[3, 165, 480], [3.25, 180, 715], [3.5, 192, 790], [3.75, 175, 870], [4, 150, 940]];

function spinningLantern(t) {            // the khom phat on its arm, and the three children under it, drawn before the great drum
  pen.strokeStyle = "#6a4a2a";          // the arm, from the string's pole at x 60
  pen.lineCap = "round";
  pen.lineWidth = 7;
  pen.beginPath();
  pen.moveTo(60, PHAT[1] - 10);
  pen.lineTo(PHAT[0] + 6, PHAT[1] - 4);
  pen.stroke();
  phatWalk = 0.45 * clock * 1.3;         // the frame turns 0.45 a second (khomPhat's own spin), and they walk with it
  khomPhat(PHAT[0], PHAT[1], {size: PHAT[2], lit: 1, light: true, figures: PHAT_FIGURES});
  var look = [PHAT[0], PHAT[1] + 150];  // the lantern's middle
  var gaze = {late: 0.45, spring: 0.5, smile: 1, wonder: 0.7, tilt: -0.12, at: look};   // eyes on it, in wonder
  var girlGaze = Object.assign({}, gaze, {tilt: -0.24});   // the girls' heads further back, looking up at it (owner, 2026-10-17: "tilt the girls heads back just a bit")
  // After a few seconds they put their arms down (owner, 2026-10-17): from
  // 3 s to 4 s each arm comes down, from the lantern to
  // beside the hip, the boy's pointing finger loosening as it goes. A girl's hand
  // turns about the shoulder ("way": 1 by the right of it as we see it, the
  // girl at the left; -1 by the left, the girl in yellow), its
  // distance from the shoulder dipping, early in the way, to "bend" (on the
  // sheet; an arm is about 80): 60. Sent straight from up to down, a hand came
  // within a third of an arm of its own shoulder, where the elbow has no side
  // to bend to, and it jumped (kit_check: one flip, at 73.63 s); it passed
  // the boy's chin and the mouth of the girl in yellow too. Each girl's hand
  // now goes behind the boy, who is drawn last; his own goes by BOY_DOWN.
  var down = between(t, 3, 4);
  function child(x, y, look, up, low, way, bend) {   // one child, its arm on the way down; the shoulder as person() first sets it (its about())
    var size = (look.size || 1) * 0.82;
    var S = [x + 40 * size * (look.face || 1), y - ((look.skirt ? 190 : 216) * leggyOf(look.build) + 126) * size];
    var a0 = Math.atan2(up[1] - S[1], up[0] - S[0]), a1 = Math.atan2(low[1] - S[1], low[0] - S[0]);
    while (way * (a1 - a0) < 0) { a1 += way * 2 * Math.PI; }
    var far = mix(Math.hypot(up[0] - S[0], up[1] - S[1]), Math.hypot(low[0] - S[0], low[1] - S[1]), down);
    var r = mix(far, bend, Math.sqrt(Math.sin(Math.PI * down))), a = mix(a0, a1, down);
    look.reachA = [S[0] + r * Math.cos(a), S[1] + r * Math.sin(a)];
    person(x, y, look);
  }
  var pointing = [0, 1, 1, 1, 0.8].map(function (c, i) { return mix(c, REST[i], down); });
  child(235, 975, cast("girl", Object.assign({id: "phat-girl-2", face: -1, shirt: "#e9c45c", flower: "#f6c445"}, girlGaze, {late: 0.7}, FACE(12))), [175, 540], [225, 935], -1, 60);   // she reaches up to it
  child(55, 975, cast("girl", Object.assign({id: "phat-girl"}, girlGaze, {late: 0.2}, FACE(13))), [115, 540], [70, 935], 1, 60);   // and so does she
  var wrist = where(BOY_DOWN, t);
  person(140, 980, cast("boy", Object.assign({id: "phat-boy", reachA: [wrist[0], wrist[1]], fingersA: pointing}, gaze, FACE(14))));   // he points up at it, drawn last so his hand shows
}

function sceneDance(t) {                // 70-79: a night of dancing: a dancer, a drummer, a celestial; the khom phat at the left
  skyOf(SKY_NIGHT, CLOUD_LOOKS.night, t + 60);
  pen.drawImage(NIGHT.back, 0, 0);
  hillMist(t + 70, true);
  pen.drawImage(NIGHT.front, 0, 0);

  // Six khom loi leave the ground behind the crowd one after another, from the
  // scene's first second, and climb through the night, smaller as they go;

  for (var n = 0; n < 6; n++) {

    if (age > 0) { lantern(120 + ((n * 7) % 11) * 168 + Math.sin(age * 0.8 + n) * 30, 975 - age * 115, 46 - age * 1.5); }
  }

  drumCart(pen, 110, 988, 0.75, 1);       // the temple's great drum on its cart (pieces.js), brought out for the night, beside the drummer
  // More dancers, a step behind the three and a little smaller, each in her own colours and a beat apart (owner,
  // 2026-10-20: "Add a few more dancers to the night scene")
  [[560, "#6a3f8f", "#2a1a3a", 0.15, 1, {sabai: ["#e0b23a", "#8a2a3a"], bun: "wong", flower: "#f6c445"}], [890, "#2a6a8a", "#1f2a3a", 0.4, -1], [1230, "#b8457a", "#5a1e2a", 0.65, 1]].forEach(function (d, k) {   // the third pink, not the gold of the celestial before her (owner, 2026-10-21)
    person(d[0], 962, cast("dancer", Object.assign({size: 0.86, late: d[3], spring: 0.7, smile: 1, dance: true, face: d[4], shirt: d[1], legs: d[2],

  });

  person(720, 985, cast("dancer", Object.assign({late: 0.25, spring: 0.7, smile: 1, dance: true, at: [900, 500], maiwai: true, malai: true,
                                  handA: [70 + Math.sin(t * 3) * 20, -130 - hop(t, 0.25) * 30], handB: [-60, -110 + Math.cos(t * 3) * 20]}, FACE(4))));
  person(1060, 990, cast("celestial", Object.assign({late: 0.5, spring: 0.6, smile: 1, face: -1, at: [720, 500], handA: [50, -120 - hop(t, 0.5) * 25]}, FACE(5))));
  // An old couple watches the dancing, side by side and turned to us, holding hands, their eyes on the dancer
  // (owner, 2026-10-16: "Add an old couple to the end scene too"): the cast's grandmother, and its elder, who
  // leaves his stick for the night. They stand a step behind the band, so the players sitting in front hide
  // only their legs; their hands meet in the gap between the salo's and the sueng's players' heads. One point
  // given to both is their two hands, swinging a little, high enough for his reach (his arm is 108 from shoulder
  // to wrist; a point at hanging height was 117 off and his hand stopped short of hers). They do not hop on the
  // beat, as the dancers do: the stretch of a hop would take his hand away from hers.
  var hands = [1646, 772 + 4 * Math.sin(t * 1.4)];
  person(1715, 950, cast("grandmother", Object.assign({size: 1.0, twist: 1, face: -1, spring: 0, at: [720, 640], reachA: hands, id: "old-woman", bun: "low"}, FACE(6))));
  person(1575, 955, cast("elder", Object.assign({size: 1.1, twist: 1, holding: null, spring: 0, at: [720, 640], reachA: hands, id: "old-man"}, FACE(7))));
  // The band of the north (band.js), sitting cross-legged on the ground at the right, a step nearer than the
  // dancers, facing them, each on the beat (owner, 2026-10-16: "Add the band members to the night scene"): the
  // pi chum, the salo (its bow across the piper's empty lap), the sueng (its neck behind the next player) and the
  // phin phia, as far right as the words under the picture allow.
  [["pichum", "elder", 1420, 0.31], ["salo", "fellow", 1570, 0], ["sueng", "farmer", 1715, 0.13], ["phinphia", "fellow", 1850, 0.07]].forEach(function (b, k) {
    musician(b[2], 1005, b[0], cast(b[1], Object.assign({size: 1.0, face: -1, smile: 1, id: "band-" + b[0]}, FACE(k ? 8 + k : 17))), b[3]);
  });
  pen.restore();
}

var SCENES = [[0, 22, sceneCloth], [22, 35, sceneLane], [35, 53, scenePond], [53, 73, scenePaddy], [73, DURATION, sceneDance]];

// screen, "then go on explaining the special artifacts that are uniquely
// Lanna", and a joke about the dragon). On 2026-10-17 the owner wrote the story
// anew, in English, scene by scene ("change the text of the video to be that"),
// and it is told in Kam Mueang still: the English below is theirs, spelling
// mended, with "cats" made a tree Lanna had (owner: "Change cats to some special

// Kam Mueang, which stands by the pond. Ten lines kept their Kam Mueang, whose
// meaning had not changed; eight are new. Each line: the seconds it shows under
// the picture, what the voice is given (the written line with ๆ said out, for
// the voice drops the mark), the line as written, and its English. The facts
// come from a NotebookLM notebook of Lanna's history (Wikipedia on Mangrai,
// Chiang Mai, the sabai, the tung, the kwian, Bo Sang, khom loi, Yi Peng and the
// Chinese dragon; for the new story also Siamese cats and the Tamra Maew, which
// put those cats in Siam and not in Lanna); the Kam Mueang from a second
// notebook, with its words read from pythainlp/lanna_dict, the Charatrit
// KamMuang-Thai-English pairs and a guide to speaking Lanna, and each new line
// put to that notebook as it stood and taken in its corrected form (it changed
// เอิ้น, which is Isan, to ฮ้อง, and ใจดี to ใจ๋ดี, among others). No native
// speaker has checked it yet.
// sash_narrate.py reads WORDS out of this page, speaks each line at its second
// over sash.wav and says whether each fits before the next. CUES is the kit's
// cue sheet made from it, [beat, words, line, meaning, end], so that
// kit_check.py can say whether a cut falls in the middle of a line.
var WORDS = [[3.6, 6.4, "แต่ปางก่อน ชีวิตเดินไปจ๊า จ๊า เน้อ", "แต่ปางก่อน ชีวิตเดินไปจ๊าๆ เน้อ", "In ancient times, things moved more slowly."],
             [6.6, 10.6, "แม่หญิงพาดผ้าสะพาย ฮ้องว่าสไบเจ้า", "แม่หญิงพาดผ้าสะพาย ฮ้องว่าสไบเจ้า", "Women wore a long sash called a sabai."],
             [10.9, 15.1, "ลายตี้ทอไว้ตี้ผืนผ้า มีความหมายกั๊บชีวิตคนเมืองเน้อเจ้า", "ลายตี้ทอไว้ตี้ผืนผ้า มีความหมายกั๊บชีวิตคนเมืองเน้อเจ้า", "The patterns and symbols woven into it were meaningful to the daily life of the people."],
             [15.4, 19.8, "พญามังรายตั้งล้านนาแปลงเชียงใหม่", "พญามังรายตั้งล้านนาแปลงเชียงใหม่", "King Mangrai founded Lanna and built Chiang Mai."],
             [23, 28, "ชีวิตตี้เฮือนเฮาอยู่เงียบ เงียบ จ๊า จ๊า แต่คนเฮือนเฮาใจ๋ดี นับถือกั๋นเน้อเจ้า", "ชีวิตตี้เฮือนเฮาอยู่เงียบๆ จ๊าๆ แต่คนเฮือนเฮาใจ๋ดี นับถือกั๋นเน้อเจ้า", "Village life was quiet and slow but people treated each other with kindness and respect."],
             [28.3, 30.8, "หันตุงสูงข้างเฮือนบะลูก", "หันตุงสูงข้างเฮือนบะลูก", "See the tung banner by the house?"],
             [31, 34.6, "ตุงแขวนไว้ตี้งานปอยละก่อวันศีลเจ้า", "ตุงแขวนไว้ตี้งานปอยละก่อวันศีลเจ้า", "Tungs are hung for temple and festival days."],
             [35.15, 37.3, "คนเฮาอยู่กั๊บธรรมชาติ", "คนเฮาอยู่กั๊บธรรมชาติ", "People were more in harmony with nature."],
             [37.35, 41.15, "มีต้นกว๋าว จ้าง ดอกบัว ละก่อของดีนักขนาดเน้อเจ้า", "มีต้นกว๋าว จ้าง ดอกบัว ละก่อของดีนักขนาดเน้อเจ้า", "They had flame-of-the-forest trees, elephants, lotus flowers and many special things."],
             [41.2, 44.65, "ช้าก่อน ตัวหลงนี้มาจากเมืองจีนนา", "ช้าก่อน ตัวหลงนี้มาจากเมืองจีนนา", "Wait! This dragon came from China."],
             [44.7, 47.6, "ตัวหลงเมืองจีนมักถือแก้ว บะใช่ธง", "ตัวหลงเมืองจีนมักถือแก้ว บะใช่ธง", "Chinese dragons usually hold a pearl, not a flag!"],
             [47.65, 49.95, "พู้นแน่ะ หมู่จ้างเดินหลังต้นกล้วย", "พู้นแน่ะ หมู่จ้างเดินหลังต้นกล้วย", "Do you see the elephants walking behind the banana trees over there?"],
             [55, 57.3, "ฝนซาแล้วเหนือทุ่งนาเน้อ", "ฝนซาแล้วเหนือทุ่งนาเน้อ", "The rain is stopping over the rice fields."],
             [57.4, 61.6, "แม่หญิงควงจ้องสลัดหยาดฝน เหมือนจ้องตี้บ่อสร้างเน้อเจ้า", "แม่หญิงควงจ้องสลัดหยาดฝน เหมือนจ้องตี้บ่อสร้างเน้อเจ้า", "The women spin their umbrellas to shake off the rain, like those of Bo Sang."],
             [61.8, 65.2, "ล้านนา หมายถึง นาเป็นล้านทุ่ง", "ล้านนา หมายถึง นาเป็นล้านทุ่ง", "Lanna means a million rice fields."],
             [65.4, 69.5, "ละอ่อนจูงควายลากเกวียนไม้เจ้า", "ละอ่อนจูงควายลากเกวียนไม้เจ้า", "That boy is leading a water buffalo pulling a traditional wooden cart called a kwian."],
             [73.4, 77.6, "หันโคมสามอย่าง ช่างดนตรี กั๊บช่างฟ้อนก่อเจ้า", "หันโคมสามอย่าง ช่างดนตรี กั๊บช่างฟ้อนก่อเจ้า", "Do you see the three different kinds of lanterns and the musicians and the dancers?"],
             [77.8, 83.6, "แต่ปางก่อน งานปอยม่วนขนาด มีของดีตี้คนเฮาแปงเองเน้อเจ้า", "แต่ปางก่อน งานปอยม่วนขนาด มีของดีตี้คนเฮาแปงเองเน้อเจ้า", "In ancient times the celebrations were quite lively and full of special things the people created themselves."]];
var CUES = WORDS.map(function (w) { return [w[0] / BEAT, w[2], w[3], w[4], w[1]]; });

function draw(t) {
  var at = t / SLOW;                      // the film's own second (SLOW, above); the words are on t
  STYLE.hop = at >= 73;                   // only the dance hops on the beat
  film(at, SCENES);
  WORDS.forEach(function (w) { if (t >= w[0] && t < w[1]) { subtitle(w[3], w[4]); } });
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % LENGTH); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
