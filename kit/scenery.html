<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenery · the kit's painted places</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>var BEAT = 0.5;</script>
<script src="oldcartoon.js"></script>
<script src="flora.js"></script>
<script src="butterflies.js"></script>
<script src="night.js"></script>
<script src="thicket.js"></script>
<script src="pinewoods.js"></script>
<script src="wildplaces.js"></script>
<script src="scenery.js"></script>
<script>
// scenery.js on one sheet: a place painted as the hero film's are (docs/kit/places.md, "Painting the scenery"). The
// far mountains (farRange()), a painted tree in flower (thkTreeOn()), a pond whose far bank and sky it mirrors, its
// plants, a lotus rising out of it and a fish that leaps once, beds of flowering bushes behind, the picture framed by
// soft blossom, and the air: the light, petals and one butterfly that crosses and leaves, mirrored as it flies low
// over the water. 16 seconds, round and round.
var DURATION = 16;
var WATER = {edge: [[470, 1100], [500, 1040], [560, 990], [585, 940], [555, 890], [520, 850], [560, 812]].concat(
               [[640, 790], [800, 780], [960, 778], [1120, 781], [1280, 790]],
               [[1360, 812], [1400, 860], [1375, 920], [1340, 970], [1380, 1030], [1440, 1100]]),
             line: 780, left: 460, right: 1460, foot: 1100, depths: ["#46726a", "#2c5852"],
             mirror: [[780, 0.95], [840, 0.7], [900, 0.5], [970, 0.42]], tint: "18, 52, 48", rings: [[900, 960, 3], [1150, 1000, 9]],
             mist: "246, 250, 246"};
WATER.top = WATER.edge.slice(7, 12);
var LEAP = {at: 6, from: [820, 900], to: [920, 900], high: 90, air: 0.85, size: 1.3};
function flier(t) { return butterflyDrift(t - 2, 1500, 860, {vx: -80, weave: 45, seed: 8}); }
function build() {
  var set = document.createElement("canvas");
  set.width = WIDE;
  set.height = 1080;
  var brush = set.getContext("2d"), keep = pen;
  brush.drawImage(farRange("#a9cfc9", "226, 238, 240", 700), 0, 0);
  brush.fillStyle = "#8fc47a";                       // the near ground
  brush.fillRect(0, 760, WIDE, 320);
  pen = brush;
  thkTreeOn(brush, 260, 900, 0.8, 3, [["ratchaphruek", 26, 30]]);
  thkTreeOn(brush, 1680, 905, 0.75, 5, [["thongkwao", 44, 16]]);
  pen = keep;
  return {
    set: set,
    beds: [{sprite: sceneryBush(380, 110, 414, THK_SUN, [["jasmine", 16, 6], ["phayasuea", 14, 6, "#ec6c9c"]]), x: 700, y: 732},
           {sprite: sceneryBush(420, 120, 415, THK_SUN, [["dokkaew", 18, 7], ["orchid", 10, 7, "#b25cc0"]]), x: 1080, y: 728},
           {sprite: sceneryBush(460, 260, 411, THK_GREENS, [["jasmine", 40, 7], ["sarapee", 16, 9]]), x: 120, y: 1000},
           {sprite: sceneryPlant("tahern", 1.5), x: 1800, y: 1040}],
    frame: [{sprite: sceneryHanging(520, 240, 482, THK_SHADE, [["phayasuea", 40, 10, "#f3a6c0"]]), x: 140, y: -40},
            {sprite: sceneryGrass(420, 14, 451), x: -20, y: 1120}, {sprite: sceneryGrass(380, 12, 452), x: 1950, y: 1120}],
    bank: sceneryBankPlants(WATER, 600, 1300, 70),
    edge: sceneryEdgePlants(WATER, 570, 1340, 200),
    near: [["reeds", 560, 1060, 1.0, 1], ["grass", 500, 1050, 0.34, 2], ["reeds", 1370, 980, 0.8, 5], ["grass", 1420, 1070, 0.4, 6]]
  };
}
function sceneryScene(t) {
  var S = thkOnce("scenery-sheet", build);
  skyTo(t);
  pen.drawImage(S.set, 0, 0);
  sceneryBeds(t, S.beds);
  sceneryWaterDepths(WATER);
  sceneryBeds(t, S.bank, {sway: 0.2});
  sceneryLotus("under", 1180, 1030, 60, 1.1, 1, "#e9627f", t);
  sceneryWaterSurface(t, WATER, function () { sceneryMirrored(t, flier(t), 50, "bluebottle", {size: 1.3, seed: 5, turn: -1.2}); });
  sceneryWaterPlants(t, S.edge);
  sceneryLeap(t, "rings", LEAP);
  sceneryLeap(t, "air", LEAP);
  sceneryLotus("over", 1180, 1030, 60, 1.1, 1, "#e9627f", t);
  sceneryWaterPlants(t, S.near);
  var b = flier(t);
  butterfly("bluebottle", b.x, b.y, t, {turn: b.turn - 1.2, size: 1.3, seed: 5});
  sceneryBeds(t, S.frame, {sway: 0.4, blur: 5});
  sceneryAir(t, {petals: [26, "#f6b8cc", 3, 1.1], light: [0.7, 2]});
}
function skyTo(t) {                                 // a day's sky, pale toward the hills
  var g = pen.createLinearGradient(0, 0, 0, 780);
  g.addColorStop(0, "#9fd0dc");
  g.addColorStop(1, "#eef4e8");
  pen.fillStyle = g;
  pen.fillRect(0, 0, WIDE, 1080);
}
var SCENES = [[0, DURATION, sceneryScene]];
function draw(t) { film(t, SCENES); }
var rendering = false;
function play(now) { if (!rendering) { draw((now / 1000) % DURATION); } requestAnimationFrame(play); }
requestAnimationFrame(play);
</script>
</body>
</html>
