<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Slow Life Studios</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tai+Tham:wght@500;700&family=Noto+Serif+Thai:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {wide: 1920, pixels: 2, hop: false, film: 0.35, light: [0.6, -0.4]};</script>
<script src="oldcartoon.js"></script>
<script src="highlands.js"></script>
<script src="naga.js"></script>
<script src="beasts.js"></script>
<script src="myth.js"></script>
<script src="northbirds.js"></script>
<script src="himmaphan.js"></script>
<script>
// The opening card of Slow Life Studios: dawn, high over the mountains of the north. Peaks stand out of a sea of
// mist, ridge behind ridge, gold where the low sun finds them; mist drifts in the valleys below. In the air, at our
// height, birds glide by on long rolling curves, unhurried: egrets, some so far off they are flecks, a hong on the
// wing; far off, Phaya Luang, a blue magpie, and birds so far away they are only a "v" each. The camera rises a little; the studio's name comes up in the Lanna script, gold, with its Thai letters
// and its English. (Owner, 2026-10-21: "Change the SLS video to be of a misty mountain scene with birds flying and
// ... these Thai angels and other mystic beings flying around. Everything should move glide and soar effortlessly
// and slowly as if viewing something really high up"; golden dawn; the hong, Phaya Luang, a kinnari and ordinary
// birds too. Before, it was an evening by a river, the house's lamp and fireflies over the water.)
var DURATION = 12;
var BEAT = 0.5;
// The name in Kam Mueang (2026-10-19): the voice project's writer gave two for "Slow Life Studios"; the owner took
// the more Kam Mueang of them, โรงยะหนังชีวิตจ้า ๆ, "the house where films of the slow life are made" (ยะ, to make,
// and จ้า, slow, are the north's; Pan's rules changed nothing). Written in the Lanna script by the Kam Mueang
// alphabet's own rules (alphabet.js lanna(), every syllable by rule; โรง keeps its ร, ᩁ, as Lanna spelling does,
// though the north says it hong; ๆ is the Lanna ᩻). Not yet checked by a native speaker.
var SLS_NAME = {lanna: "ᩁᩰᩫ᩠ᨦᨿᩉ᩠ᨶᩢᨦᨩᩦᩅᩥ᩠ᨲᨧ᩶ᩣ᩻", thai: "โรงยะหนังชีวิตจ้า ๆ", english: "Slow Life Studios"};
var SLS_SUN = [1380, 610];                           // the sun, just risen behind the far peaks
var SLS_SHEET = null;

// Who flies, smallest and hazed the farthest: [what, x at 0 s, y, pixels a second on average, size, its own look].
// Birds in place of the thewada (owner, 2026-10-21: "Replace the angels with birds and make them move a touch faster
// but also at variable rates and over gently rolling curves rather than flat lines", then "Add some of the egrets
// really far away and the v shaped super far away birds too"): each one's pace swells and eases (by a third, at its
// own rate) and it rides long gentle waves up and down, tilting with them (slsPath). Then fewer (owner, 2026-10-21:
// "Get rid of the near egret, the Thai angel one set of v birds, one of the golden birds and the hornbills"): the
// nearest egret, the kinnari, the flock on the right, the smaller hong and both hornbills are gone; then "Get rid of
// the white bird near the bird with blue markings and make that bird much smaller" and "Also get rid of the largest
// set of v birds": that egret and the other flock are gone, and the magpie is far off.
// The hong soars ("Have the golden bird just soar and glide without flapping", then "Actually have it beat it's
// wings just two or three times"): three beats from 4 s, then it glides on.
var SLS_FLIGHT = [
  ["egret", 420, 600, 20, 0.07, {seed: 0.4}],
  ["egret", 470, 585, 21, 0.06, {seed: 1.9}],
  ["egret", 1560, 640, -18, 0.07, {seed: 2.8}],
  ["egret", 1610, 628, -19, 0.06, {seed: 3.6}],
  ["luang", 260, 520, 24, 0.22, {}],
  ["egret", 240, 660, 30, 0.16, {seed: 1.2}],
  ["magpie", 1320, 360, 30, 0.2, {}],
  ["hong", 640, 650, 40, 0.75, {seed: 4.4, soar: true, beats: [4, 3]}]
];

function slsRidge(base, tall, shape) {               // a ridge of hills: its height at every x
  return function (x) { return base - tall * (0.55 + 0.3 * Math.sin(x * 0.0035 + shape) + 0.15 * Math.sin(x * 0.009 + shape * 2)); };
}

function slsPeaks(base, spots) {                     // a range of peaks: each [x, height, width] standing out of the mist
  return function (x) {
    var top = 0;
    spots.forEach(function (s) { top = Math.max(top, s[1] * Math.exp(-Math.pow((x - s[0]) / s[2], 2))); });
    return base - top - 6 * Math.sin(x * 0.02 + base);
  };
}

function slsSheet() {                                // the sky, the sun's glow and the far ranges, painted once
  if (SLS_SHEET) { return SLS_SHEET; }
  var paper = document.createElement("canvas");
  paper.width = WIDE;
  paper.height = 1080;
  var b = paper.getContext("2d"), sky = b.createLinearGradient(0, 0, 0, 760);
  sky.addColorStop(0, "#3a4a7a");                    // dawn: blue overhead, warming to rose and gold at the horizon
  sky.addColorStop(0.45, "#a98aa8");
  sky.addColorStop(0.78, "#f0b884");
  sky.addColorStop(1, "#fbe0a8");
  b.fillStyle = sky;
  b.fillRect(0, 0, WIDE, 1080);
  var glow = b.createRadialGradient(SLS_SUN[0], SLS_SUN[1], 10, SLS_SUN[0], SLS_SUN[1], 620);
  glow.addColorStop(0, "rgba(255, 244, 200, 0.95)");
  glow.addColorStop(0.12, "rgba(255, 220, 150, 0.6)");
  glow.addColorStop(1, "rgba(255, 200, 140, 0)");
  b.fillStyle = glow;
  b.fillRect(0, 0, WIDE, 1080);
  [[680, "#b48aa0", [[300, 160, 220], [820, 210, 260], [1500, 190, 240], [1900, 150, 200]]],     // the far ranges, palest
   [740, "#9a7d98", [[120, 200, 240], [640, 260, 200], [1180, 230, 260], [1720, 250, 220]]]].forEach(function (r) {
    var top = slsPeaks(r[0], r[2]);
    b.fillStyle = r[1];
    b.beginPath();
    b.moveTo(0, 1080);
    for (var x = 0; x <= WIDE; x += 6) { b.lineTo(x, top(x)); }
    b.lineTo(WIDE, 1080);
    b.closePath();
    b.fill();
    var lit = b.createLinearGradient(SLS_SUN[0] - 600, 0, SLS_SUN[0] + 200, 0);   // gold on the faces toward the sun
    lit.addColorStop(0, "rgba(255, 210, 140, 0)");
    lit.addColorStop(1, "rgba(255, 210, 140, 0.35)");
    b.fillStyle = lit;
    b.fill();
  });
  var near = slsPeaks(880, [[240, 400, 150], [1020, 320, 170], [1660, 440, 160]]);   // the nearer peaks, steep, in forest
  forestSlope(b, near, 0, WIDE, 1080, {far: 0.55, small: 4, large: 9, haze: "#8a7a90", seed: 31});
  SLS_SHEET = paper;
  return paper;
}

function slsPath(one, t) {                           // where one of SLS_FLIGHT is at t: its pace swelling and easing, on rolling curves
  var v = one[3] * 1.3, w = 0.35 + 0.25 * dice(Math.abs(one[1]) + 7), ph = 6.3 * dice(Math.abs(one[1]) + 3);
  var x = one[1] + v * t + (v * 0.33 / w) * (Math.sin(w * t + ph) - Math.sin(ph));    // the pace, a third up and down
  var lift = 34 * Math.min(1, one[4] * 2.2 + 0.2), w2 = 0.45 + 0.3 * dice(Math.abs(one[1]) + 11), ph2 = 6.3 * dice(Math.abs(one[1]) + 5);
  var y = one[2] + lift * Math.sin(w2 * t + ph2);
  var slope = lift * w2 * Math.cos(w2 * t + ph2) / (Math.abs(v) * (1 + 0.33 * Math.cos(w * t + ph)) || 1);
  return {x: x, y: y, tilt: Math.atan(slope) * 0.6 * (v < 0 ? -1 : 1)};
}

function slsBeing(one, t) {                          // one of SLS_FLIGHT at second t
  var at = slsPath(one, t), size = one[4], face = one[3] < 0 ? -1 : 1;
  var look = Object.assign({size: size, face: face, light: 0.75}, one[5]);
  pen.save();
  pen.globalAlpha = 0.45 + 0.55 * Math.min(1, size * 1.4);   // the far ones hazed by the air between
  pen.translate(at.x, at.y);
  pen.rotate(at.tilt);                               // tilting up as it climbs a wave, down as it comes off it
  if (one[0] === "hong") { hongFlight(0, 0, t, look); }
  else if (one[0] === "luang") { luang(0, 0, {size: size, face: face}); }
  else if (one[0] === "magpie") { blueMagpie(0, 0, t, {size: size, face: face, fly: true}); }
  else if (one[0] === "egret") { egret(0, 0, t, {size: size, face: face, fly: true, seed: look.seed}); }
  pen.restore();
}

// Birds so far off they are only a "v" each, flapping: two loose skeins drifting slowly across the far sky, and a few
// alone, each on its own gentle wave.
function slsFarBirds(t) {
  pen.save();
  pen.strokeStyle = "rgba(70, 52, 70, 0.55)";
  pen.lineCap = "round";
  for (var n = 0; n < 34; n++) {
    var skein = n < 14 ? 0 : n < 26 ? 1 : 2, k = skein === 0 ? n : skein === 1 ? n - 14 : n - 26;
    var bx, by;
    if (skein === 2) {                              // the ones alone
      bx = (dice(n + 40) * WIDE + (dice(n + 41) - 0.5) * 30 * t + WIDE) % WIDE;
      by = 380 + dice(n + 42) * 220;
    } else {                                        // the two skeins, each a loose V
      var lead = skein === 0 ? [380 + 16 * t, 300] : [1500 - 13 * t, 250];
      var side = k % 2 ? 1 : -1, rank = Math.ceil(k / 2);
      bx = lead[0] - (skein === 0 ? 1 : -1) * rank * 14 + 3 * Math.sin(t + n);
      by = lead[1] + side * rank * 7 + 4 * Math.sin(t * 0.7 + n * 1.3);
    }
    by += 6 * Math.sin(t * 0.5 + n);
    var w = 3 + 2.5 * dice(n + 43), flap = w * 0.6 * Math.sin(t * 6 + n * 2.1);
    pen.lineWidth = 1.3;
    pen.beginPath();
    pen.moveTo(bx - w, by - flap);
    pen.lineTo(bx, by + 1);
    pen.lineTo(bx + w, by - flap);
    pen.stroke();
  }
  pen.restore();
}

function slsTitle(t) {                               // the name, in the Lanna script, gold; its Thai letters; its English
  var come = between(t, 4.5, 6.5) * (1 - between(t, 11, 12));
  if (come <= 0) { return; }
  pen.save();
  pen.globalAlpha = come;
  pen.textAlign = "center";
  pen.shadowColor = "rgba(120, 70, 20, 0.6)";        // on a bright dawn sky the gold wants a darker halo to stand out
  pen.shadowBlur = 22;
  pen.font = "700 112px 'Noto Sans Tai Tham', 'Sans Serif Collection', serif";
  var gold = pen.createLinearGradient(0, 130, 0, 250);
  gold.addColorStop(0, "#fff1c0");
  gold.addColorStop(0.5, "#e8b84a");
  gold.addColorStop(1, "#b07a22");
  pen.fillStyle = gold;
  pen.fillText(SLS_NAME.lanna, WIDE / 2, 230);
  pen.shadowBlur = 10;
  pen.strokeStyle = "rgba(255, 236, 190, 0.9)";       // a fine flourish under it, from the middle out
  pen.lineWidth = 2;
  var reach = 330 * between(t, 5.5, 7.5);
  pen.beginPath();
  pen.moveTo(WIDE / 2 - reach, 304); pen.quadraticCurveTo(WIDE / 2, 316, WIDE / 2 + reach, 304);
  pen.stroke();
  pen.font = "500 46px 'Noto Serif Thai', 'Leelawadee UI', serif";
  pen.fillStyle = "#fff4dc";
  pen.fillText(SLS_NAME.thai, WIDE / 2, 368);
  pen.font = "italic 40px Georgia, 'Times New Roman', serif";
  pen.fillStyle = "#fff0d8";
  pen.fillText(SLS_NAME.english, WIDE / 2, 424);
  pen.restore();
}

function sceneSLS(t) {
  var rise = between(t, 0, DURATION);                // the camera rises a little, and comes in, slowly
  pen.save();
  pen.translate(WIDE / 2, 600);
  pen.scale(1 + 0.04 * rise, 1 + 0.04 * rise);
  pen.translate(-WIDE / 2, -600 + 40 * rise);
  pen.drawImage(slsSheet(), 0, 0);
  mistSea(pen, t, {level: 790, left: -100, right: WIDE + 100, deep: 340, swell: 16, wave: 240, drift: 5, layers: 3,
                   colour: "#f4e2d0", glow: "#ffd8a0", seed: 11, alpha: 0.9});   // the sea of mist the peaks stand out of
  var under = pen.createLinearGradient(0, 860, 0, 1120);  // and below it, nothing but mist: we are far above the valleys
  under.addColorStop(0, "rgba(244, 226, 208, 0)");
  under.addColorStop(0.35, "rgba(244, 226, 208, 0.92)");
  under.addColorStop(1, "rgba(250, 236, 220, 1)");
  pen.fillStyle = under;
  pen.fillRect(-100, 860, WIDE + 200, 300);
  slsFarBirds(t);                                    // the birds so far off they are a "v" each
  SLS_FLIGHT.forEach(function (one, k) {             // the birds, the far ones first
    if (k === 7) {
      mistDrift(pen, t, {left: -200, right: WIDE + 200, top: 640, bottom: 760, count: 5, wide: 700, drift: 7, seed: 4,
                         colour: "#f6e6d4", glow: "#ffd8a0", alpha: 0.45});   // mist between the far and the near
    }
    slsBeing(one, t);
  });
  pen.restore();
  slsTitle(t);
  var dark = Math.max(1 - between(t, 0, 1.8), between(t, 11.2, 12));
  if (dark > 0) {
    pen.fillStyle = "rgba(0, 0, 0, " + dark.toFixed(3) + ")";
    pen.fillRect(0, 0, WIDE, 1080);
  }
}

function draw(t) { film(t, [[0, DURATION, sceneSLS]]); }
var rendering = false;
function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}
requestAnimationFrame(play);
</script>
</body>
</html>
