<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>dance - the whole dance of a video, read into the model</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="oldcartoon.js"></script>
<!-- TRACK: every tenth of a second of a classical dancer's video, read into the kit's poses by
     dance_track.py (MediaPipe Pose): hands as directions from the shoulders, the bend of the
     torso, the tilt of the head, the half-sit of the knees, a lifted foot, the turn to the camera. -->
<script src="dance_track.js"></script>
<script>
// The whole dance. The stick figure on the left is the movement read from
// the video; the dancer on the right is a model from the cast, pinned to
// the same track. Eight of its positions, named, are the movement guide in
// docs/STYLE.md.
var DURATION = TRACK[TRACK.length - 1][0];

var BEAT = 0.5;

var PLACE = (function () {               // the set is painted once, when the page opens
  var paper = document.createElement("canvas");
  paper.width = WIDE;
  paper.height = 1080;
  var brush = paper.getContext("2d");
  brush.fillStyle = "#8ccfc6";
  brush.fillRect(0, 0, WIDE, 1080);
  clouds(brush, WIDE);
  brush.filter = "blur(3px)";
  hills(brush, WIDE, 780, 300, 2.6, "#8dbfa9");
  brush.filter = "blur(1px)";
  brush.fillStyle = "#efd2b4";
  brush.fillRect(0, 850, WIDE, 230);
  tree(brush, 1250, 846, 0.9);
  pathside(brush, WIDE);
  wash(brush, WIDE);
  return paper;
})();

function sceneDance(t) {
  pen.drawImage(PLACE, 0, 0);
  var pose = trackAt(t, TRACK);          // the track as one movement, not stopping at each key
  stick(440, GROUND + 60, Object.assign({size: 1.3, dance: true}, pose));
  person(1010, GROUND + 60, cast("dancer", Object.assign({late: 0, spring: 0.08, smile: 1}, pose)));
}

var SCENES = [[0, DURATION, sceneDance]];

function draw(t) {
  film(t, SCENES);
  subtitle("the whole dance, read from the video", "second " + Math.floor(t) + " of " + Math.floor(DURATION));
}

var rendering = false;

function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}

requestAnimationFrame(play);
</script>
</body>
</html>
