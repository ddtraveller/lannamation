<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>pinewoods - the three pines on a hillside of the high country</title>
<style>html, body { margin: 0; background: #111; } canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {wide: 1920, pixels: 2, film: 0.3, light: [-0.6, 0.5]};</script>
<script>var BEAT = 0.5;</script>
<script src="oldcartoon.js"></script>
<script src="flora.js"></script>
<script src="butterflies.js"></script>
<script src="northbirds.js"></script>
<script src="thicket.js"></script>
<script src="pinewoods.js"></script>
<script>
// The "pinewoods" sheet: pinewoods.js. The three pines on a hillside of the high country in the morning: on the
// left a stand of forest pines with an oak and a chestnut among them (pine "forest", broadleaf()), in the middle the
// old pine (pine "old"), on the right young pines (pine "young"); behind them hills clothed in forest to their feet
// (forestHill()), mist in the valleys (softMist()), the dry grass of the slope in front (grassBank()).
var DURATION = 10;
var DRY = ["#4e4220", "#6e5e28", "#8a7832", "#a08e3e", "#b8a650", "#d0be6a", "#e6d892"];
function build() {
  var n, grasses = [];
  for (n = 0; n < 6; n++) {
    (function (k) {
      grasses.push(thkSprite(700, 320, 350, 290, function () { grassBank(620, 150 + 50 * dice(k), 4 + k * 7, k % 3 === 2 ? GRASS_GREEN : GRASS_DRY, k % 3 === 2 ? 0 : 7); }));
    })(n);
  }
  var BLUE = THK_SHADE.map(function (g) { return blend(g, "#5a7a8a", 0.45); });
  var hillFar = forestHill({seed: 2, tall: 330, deep: 120, gap: 30, greens: BLUE, sizes: ["small"], pines: 30, pineHigh: 200});
  var hillMid = forestHill({seed: 5, tall: 240, deep: 150, gap: 36, greens: THK_SHADE, sizes: ["small", "medium"], pines: 45, pineHigh: 260});
  var hillNear = forestHill({seed: 9, tall: 150, deep: 200, gap: 44, greens: THK_GREENS, sizes: ["small", "medium", "large"], pines: 40, pineHigh: 340});
  var wood = [], mid = [], meadow = [], front = [], near = [];
  var woodPine = [];
  for (n = 0; n < 6; n++) { woodPine.push(pineSprite(560 + 180 * dice(n * 3.3), "forest", 11 + n * 2)); }
  [[-150, 0.95], [-40, 1.1], [60, 0.85], [230, 1.05], [300, 0.9], [440, 1], [520, 0.8], [1900, 0.9], [2050, 1.05]].forEach(function (w, k) {   // A: forest pines
    wood.push({sprite: woodPine[k % 6], x: w[0], y: 930 + 12 * dice(k), size: w[1], reach: 0.1});
  });
  wood.push({sprite: broadleafSprite(520, 51, THK_GREENS), x: 760, y: 928, size: 1, reach: 0.06});   // an oak and a chestnut
  wood.push({sprite: broadleafSprite(440, 53, THK_SUN), x: 1420, y: 924, size: 1, reach: 0.06});
  wood.sort(function (p, q) { return p.y - q.y; });
  mid.push({sprite: pineSprite(780, "old", 21), x: 1080, y: 960, size: 1, reach: 0.05});   // B: the old pine
  for (n = 0; n < 14; n++) {                        // the dry grass of the slope, bank on bank
    meadow.push({sprite: grasses[n % 6], x: -250 + n * 230 + 50 * dice(n), y: 935 + 20 * dice(n + 1), size: 0.5 + 0.15 * dice(n + 2), reach: 0.15});
  }
  for (n = 0; n < 14; n++) {
    front.push({sprite: grasses[(n + 2) % 6], x: -250 + n * 190 + 60 * dice(n * 3), y: 1015 + 45 * dice(n + 4), size: 0.85 + 0.3 * dice(n + 3), reach: 0.2});
  }
  front.push({sprite: pineSprite(400, "young", 31), x: 1560, y: 1035, size: 1, reach: 0.12});   // C: the young pines
  front.push({sprite: pineSprite(300, "young", 37), x: 1780, y: 1050, size: 1, reach: 0.12});
  front.push({sprite: pineSprite(220, "young", 39), x: 1690, y: 1065, size: 1, reach: 0.12});
  front.sort(function (p, q) { return p.y - q.y; });
  [-60, 640, 1350, 1990].forEach(function (x, k) { near.push({sprite: grasses[k % 6], x: x, y: 1180, size: 1.6, reach: 0.25}); });
  return [
    {depth: 0.05, blur: 1.2, haze: 0.42, items: [{sprite: hillFar.sprite, x: -300, y: 720, reach: 0}], live: function (t) {
      softMist(t, 740, 100, 0.55, 3);
    }},
    {depth: 0.11, blur: 0.8, haze: 0.25, items: [{sprite: hillMid.sprite, x: -300, y: 820, reach: 0}], live: function (t) {
      softMist(t, 845, 90, 0.55, 7);
    }},
    {depth: 0.2, blur: 0.5, haze: 0.12, items: [{sprite: hillNear.sprite, x: -300, y: 905, reach: 0}]},
    {depth: 0.45, blur: 0.4, haze: 0.04, items: meadow},
    {depth: 0.6, blur: 0.3, items: wood},
    {depth: 0.72, blur: 0.2, items: mid},
    {depth: 1, blur: 0, items: front},
    {depth: 1.5, blur: 5, items: near}
  ];
}
function scene(at) {
  var layers = thkOnce("pines", build);
  var sky = pen.createLinearGradient(0, 0, 0, 860);
  sky.addColorStop(0, "#86b4d2");
  sky.addColorStop(0.6, "#d8e6e6");
  sky.addColorStop(1, "#f8eccc");
  pen.fillStyle = sky;
  pen.fillRect(0, 0, WIDE, 1080);
  var sun = pen.createRadialGradient(360, 300, 10, 360, 300, 700);   // the morning sun behind the haze, upper left
  sun.addColorStop(0, "rgba(255, 244, 210, 0.75)");
  sun.addColorStop(1, "rgba(255, 244, 210, 0)");
  pen.fillStyle = sun;
  pen.fillRect(0, 0, WIDE, 1080);
  thkLayers(at, layers, {x: 18 * at, z: 0, y: 0}, "#eaeee2");
  thkLight(at, 0.55, 4);
  thkVignette(0.25);
  pen.fillStyle = "rgba(246, 237, 212, 0.85)";
  [['pine "forest"', 300], ['pine "old"', 1060], ['pine "young"', 1660]].forEach(function (l) { pen.fillRect(l[1] - 140, 1032, 280, 32); });
  pen.fillStyle = "#3a2c1c"; pen.textAlign = "center"; pen.font = "21px Georgia, serif";
  [['pine "forest"', 300], ['pine "old"', 1060], ['pine "young"', 1660]].forEach(function (l) { pen.fillText(l[0], l[1], 1055); });
}
var SCENES = [[0, DURATION, scene]];
function draw(t) { film(t, SCENES); }
var rendering = false;
function play(now) { if (!rendering) { draw((now / 1000) % DURATION); } requestAnimationFrame(play); }
requestAnimationFrame(play);
</script>
</body>
</html>
