<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>riding - a riding horse's gear, and a rider astride</title>
<style>
  html, body { margin: 0; background: #111; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script>window.FILM_STYLE = {wide: 1920, hop: false};</script>
<script src="oldcartoon.js"></script>
<script src="backdrops.js"></script>
<script src="beasts.js"></script>
<script>
// The "riding" sheet: beasts.js horse() with look.tack: a village horse in its folded cloth, a riding horse in the north's
// saddle with red tassels, and a king's white horse in brocade and gold, each walking with a rider astride its seat
// (person() with floor: "astride", as on the elephant).
var DURATION = 8;

var BEAT = 0.5;

function caption(text, x, y) {
  pen.fillStyle = "#3a2c1c";
  pen.textAlign = "center";
  pen.font = "22px Georgia, 'Times New Roman', serif";
  pen.fillText(text, x, y);
}

function sheet(t) {
  pen.drawImage(backdrop("paddy"), 0, 0);
  [["village", "#8a5a3a", "#2a1f1a", "villager", 360], ["lanna", "#6a3a24", "#1e1612", "fellow", 960], ["royal", "#efe8de", "#d8cfc4", "noble", 1560]].forEach(function (k, n) {
    var h = horse(k[4], 940, {size: 0.85, colour: k[1], mane: k[2], step: t * 0.8, tack: k[0]});
    person(h.seat[0], h.seat[1] + 18, cast(k[3], {id: "rider" + n, floor: "astride", size: 1.05, face: 1}));
  });
  pen.fillStyle = "rgba(246, 237, 212, 0.9)";
  pen.fillRect(0, 1030, WIDE, 50);
  caption('tack: "village", a folded cloth and a rope   ·   "lanna", the north’s saddle and red tassels   ·   "royal", brocade and gold', WIDE / 2, 1062);
}

function draw(t) {
  settled(t, function (at) {
    clock = at;
    sheet(at);
  });
  screen.fillStyle = "#111";
  screen.fillRect(0, 0, 1920, 1080);
  screen.drawImage(FILM, 0, 0, 1920, 1080);
}

var rendering = false;
function play(now) {
  if (!rendering) { draw((now / 1000) % DURATION); }
  requestAnimationFrame(play);
}
requestAnimationFrame(play);
</script>
</body>
</html>
